// motor/simulacro.js
//
// Simulacro de examen: una sesión mixta, cronometrada y SIN retroalimentación
// hasta el final, para medir si estás listo — no solo para aprender.
//
//  • Cuántas preguntas salen de cada sección sigue el peso del examen
//    (SECCIONES[].pesoExamen). Si una sección todavía no tiene ejercicios, el
//    simulacro es "parcial": reparte lo que falta entre las demás y lo avisa.
//  • Dentro de cada sección se muestrea al azar, favoreciendo ejercicios de
//    prioridad alta (`peso: 3`) y los que no han salido en simulacros previos.
//  • Se puede ir y volver, marcar preguntas y revisar un resumen antes de
//    entregar. El reloj corre por marca de tiempo: si cierras la app, sigue.
//  • Al terminar: puntaje, desglose por dominio / sección / habilidad oficial,
//    lista de falladas con su explicación y un repaso con retroalimentación.

let _simVista = null; // "home" | "pregunta" | "resumen" | "resultados" | "repaso"
let _simResultadoId = null;
let _simTimerId = null;
let _simRepaso = null; // { cola: [exerciseId...], i, resultadoId }

// ------------------------------------------------------------
// Muestreo
// ------------------------------------------------------------

function esEjercicioDeSimulacro(e) {
  return !!e && e.type !== "texto-libre";
}

function disponibilidadSimulacro() {
  const porSeccion = {};
  let total = 0;
  SECCIONES.forEach((s) => {
    const n = getSeccionState(s.id).ejercicios.filter(esEjercicioDeSimulacro).length;
    porSeccion[s.id] = n;
    total += n;
  });
  return { porSeccion, total };
}

// Cuántas preguntas salen de cada sección. Respeta pesoExamen; lo que no se
// pueda cubrir (sección vacía o con pocos ejercicios) se reparte entre las
// demás, favoreciendo a las que más pesan.
function distribucionSimulacro(disp) {
  const dist = {};
  let asignadas = 0;
  SECCIONES.forEach((s) => {
    dist[s.id] = Math.min(s.pesoExamen, disp.porSeccion[s.id]);
    asignadas += dist[s.id];
  });
  let faltan = SIMULACRO.totalPreguntas - asignadas;
  let guardia = 0;
  while (faltan > 0 && guardia++ < 1000) {
    const candidatas = SECCIONES.filter((s) => dist[s.id] < disp.porSeccion[s.id]);
    if (!candidatas.length) break;
    candidatas.sort((a, b) => b.pesoExamen / (dist[b.id] + 1) - a.pesoExamen / (dist[a.id] + 1));
    dist[candidatas[0].id]++;
    faltan--;
  }
  return dist;
}

// % del peso real del examen que este simulacro logra representar (0–100).
function coberturaSimulacro(dist) {
  const cubierto = SECCIONES.reduce((t, s) => t + Math.min(dist[s.id] || 0, s.pesoExamen), 0);
  return Math.round((cubierto / SIMULACRO.totalPreguntas) * 100);
}

function pesoDeMuestreo(e) {
  const prioridad = { 1: 1, 2: 2, 3: 4 }[e.peso || PESO_EJERCICIO_DEFECTO] || 2;
  const visto = AppState.simulacros.vistos[e.id];
  const novedad = !visto ? 2 : Date.now() - new Date(visto).getTime() < 86400000 ? 0.5 : 1;
  return prioridad * novedad;
}

function muestrearPonderado(lista, k) {
  const pool = lista.map((x) => ({ x, w: Math.max(0.1, pesoDeMuestreo(x)) }));
  const out = [];
  while (out.length < k && pool.length) {
    const total = pool.reduce((s, p) => s + p.w, 0);
    let r = Math.random() * total;
    let i = 0;
    for (; i < pool.length - 1; i++) {
      r -= pool[i].w;
      if (r <= 0) break;
    }
    out.push(pool[i].x);
    pool.splice(i, 1);
  }
  return out;
}

// ------------------------------------------------------------
// Ciclo de vida
// ------------------------------------------------------------

function iniciarSimulacro() {
  const disp = disponibilidadSimulacro();
  if (disp.total < SIMULACRO.minimoParaIniciar) return false;
  const dist = distribucionSimulacro(disp);
  let preguntas = [];
  SECCIONES.forEach((s) => {
    if (!dist[s.id]) return;
    const elegibles = getSeccionState(s.id).ejercicios.filter(esEjercicioDeSimulacro);
    muestrearPonderado(elegibles, dist[s.id]).forEach((e) => preguntas.push({ exerciseId: e.id, seccion: s.id }));
  });
  preguntas = barajar(preguntas);
  // si el simulacro es parcial, el tiempo se reduce en proporción
  const minutos = Math.max(5, Math.round((SIMULACRO.minutos * preguntas.length) / SIMULACRO.totalPreguntas));
  const ahora = Date.now();
  AppState.simulacros.actual = {
    id: "sim-" + ahora,
    inicioISO: new Date(ahora).toISOString(),
    finISO: new Date(ahora + minutos * 60000).toISOString(),
    minutos,
    preguntas,
    respuestas: {}, // exerciseId -> { respuesta, correcto }
    marcadas: {}, // exerciseId -> true
    indice: 0,
    cobertura: coberturaSimulacro(dist),
  };
  guardar();
  return true;
}

function abandonarSimulacro() {
  AppState.simulacros.actual = null;
  detenerTemporizadorSim();
  guardar();
}

function segundosRestantes(a) {
  return Math.max(0, Math.round((new Date(a.finISO).getTime() - Date.now()) / 1000));
}

function formatoReloj(seg) {
  const m = Math.floor(seg / 60);
  const s = seg % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function buscarEjercicio(id, seccionId) {
  return getSeccionState(seccionId).ejercicios.find((e) => e.id === id) || null;
}

function finalizarSimulacro(porTiempo) {
  const a = AppState.simulacros.actual;
  if (!a) return null;
  detenerTemporizadorSim();

  const usadoSeg = Math.min(a.minutos * 60, Math.round((Date.now() - new Date(a.inicioISO).getTime()) / 1000));
  const detalle = a.preguntas.map((q) => {
    const r = a.respuestas[q.exerciseId];
    return { id: q.exerciseId, seccion: q.seccion, respondida: !!r, correcto: !!(r && r.correcto), respuesta: r ? r.respuesta : null };
  });

  const porDominio = {};
  const porSeccion = {};
  const porHabilidad = {};
  detalle.forEach((d) => {
    const dom = getSeccion(d.seccion)?.dominio || 0;
    porDominio[dom] = porDominio[dom] || { t: 0, a: 0 };
    porSeccion[d.seccion] = porSeccion[d.seccion] || { t: 0, a: 0 };
    porDominio[dom].t++;
    porSeccion[d.seccion].t++;
    if (d.correcto) { porDominio[dom].a++; porSeccion[d.seccion].a++; }
    const ej = buscarEjercicio(d.id, d.seccion);
    if (ej && ej.skill) {
      const k = d.seccion + ":" + ej.skill;
      porHabilidad[k] = porHabilidad[k] || { t: 0, a: 0 };
      porHabilidad[k].t++;
      if (d.correcto) porHabilidad[k].a++;
    }
    // las falladas también alimentan el banco de errores de su sección
    if (d.respondida) actualizarErrorBank(getSeccionState(d.seccion), d.id, d.correcto, d.respuesta);
    else actualizarErrorBank(getSeccionState(d.seccion), d.id, false, null);
    AppState.simulacros.vistos[d.id] = new Date().toISOString();
  });

  const total = detalle.length;
  const aciertos = detalle.filter((d) => d.correcto).length;
  const pct = total ? Math.round((aciertos / total) * 100) : 0;
  const resultado = {
    id: a.id,
    fechaISO: new Date().toISOString(),
    minutosAsignados: a.minutos,
    usadoSeg,
    porTiempo: !!porTiempo,
    cobertura: a.cobertura,
    total,
    aciertos,
    pct,
    aprobado: pct >= SIMULACRO.aprobadoPct,
    porDominio,
    porSeccion,
    porHabilidad,
    detalle,
  };
  AppState.simulacros.historial.push(resultado);
  if (AppState.simulacros.historial.length > SIMULACRO.historialMax) AppState.simulacros.historial.shift();
  AppState.simulacros.actual = null;
  guardar();
  return resultado;
}

// ------------------------------------------------------------
// Temporizador
// ------------------------------------------------------------

function detenerTemporizadorSim() {
  if (_simTimerId) clearInterval(_simTimerId);
  _simTimerId = null;
}

function iniciarTemporizadorSim() {
  detenerTemporizadorSim();
  const tick = () => {
    const a = AppState.simulacros.actual;
    if (!a) return detenerTemporizadorSim();
    const rest = segundosRestantes(a);
    document.querySelectorAll(".sim-timer-valor").forEach((el) => {
      el.textContent = formatoReloj(rest);
      el.parentElement.classList.toggle("poco", rest <= 300);
    });
    if (rest <= 0) {
      const r = finalizarSimulacro(true);
      window._toast?.("⏰ Se acabó el tiempo: simulacro entregado");
      _simVista = "resultados";
      _simResultadoId = r?.id || null;
      renderSimulacro();
    }
  };
  _simTimerId = setInterval(tick, 1000);
  tick();
}

// ------------------------------------------------------------
// Vistas
// ------------------------------------------------------------

function contSim() {
  return document.getElementById("simulacroContainer");
}

function renderSimulacro() {
  const cont = contSim();
  if (!cont) return;
  const a = AppState.simulacros.actual;
  if (a && segundosRestantes(a) <= 0) {
    const r = finalizarSimulacro(true);
    _simVista = "resultados";
    _simResultadoId = r?.id || null;
  }
  if (!_simVista) _simVista = "home";
  if ((_simVista === "pregunta" || _simVista === "resumen") && !AppState.simulacros.actual) _simVista = "home";

  const enExamen = _simVista === "pregunta" || _simVista === "resumen" || _simVista === "repaso";
  document.body.classList.toggle("en-simulacro", enExamen);
  if (_simVista !== "pregunta" && _simVista !== "resumen") detenerTemporizadorSim();

  if (_simVista === "home") return renderSimHome(cont);
  if (_simVista === "pregunta") return renderSimPregunta(cont);
  if (_simVista === "resumen") return renderSimResumen(cont);
  if (_simVista === "resultados") return renderSimResultados(cont, _simResultadoId);
  if (_simVista === "repaso") return renderSimRepaso(cont);
}

// Al tocar la pestaña: si hay un examen en curso o unos resultados abiertos se
// conservan; de lo contrario se muestra el inicio.
function abrirSimulacroDesdeTab() {
  const enCurso = !!AppState.simulacros.actual && (_simVista === "pregunta" || _simVista === "resumen");
  const enResultados = _simVista === "resultados" || _simVista === "repaso";
  if (!enCurso && !enResultados) _simVista = "home";
  renderSimulacro();
}

// ---- Inicio ----

function renderSimHome(cont) {
  const a = AppState.simulacros.actual;
  const disp = disponibilidadSimulacro();
  const dist = distribucionSimulacro(disp);
  const cobertura = coberturaSimulacro(dist);
  const totalPreg = Object.values(dist).reduce((t, n) => t + n, 0);
  const puede = disp.total >= SIMULACRO.minimoParaIniciar;
  const parcial = cobertura < 100;
  const maxPeso = Math.max(...SECCIONES.map((s) => s.pesoExamen));

  const filas = SECCIONES.map((s) => {
    const n = dist[s.id] || 0;
    const vacia = !disp.porSeccion[s.id];
    return `
      <div class="sim-fila ${vacia ? "vacia" : ""}">
        <span class="sim-fila-id">${s.id}</span>
        <span class="sim-fila-nombre">${escHTML(s.titulo)}</span>
        <div class="sim-fila-barra"><div style="width:${(n / maxPeso) * 100}%"></div></div>
        <span class="sim-fila-n">${vacia ? "—" : n}</span>
      </div>`;
  }).join("");

  const historial = [...AppState.simulacros.historial].reverse().slice(0, 6);
  const hist = historial.length
    ? historial.map((r) => `
        <button class="sim-hist-item" data-res="${escAttr(r.id)}">
          <span class="sim-hist-pct ${r.aprobado ? "ok" : "mal"}">${r.pct}%</span>
          <span class="sim-hist-meta">${new Date(r.fechaISO).toLocaleDateString("es-CO", { day: "numeric", month: "short" })} · ${r.aciertos}/${r.total} · ${Math.round(r.usadoSeg / 60)} min${r.cobertura < 100 ? " · parcial" : ""}</span>
          <span class="sim-hist-ir">›</span>
        </button>`).join("")
    : `<p class="ajustes-nota">Todavía no has hecho ningún simulacro.</p>`;

  const enCurso = a
    ? `<div class="sim-encurso">
         <div><strong>Simulacro en curso</strong><br><span class="sim-timer ${segundosRestantes(a) <= 300 ? "poco" : ""}">⏱ <span class="sim-timer-valor">${formatoReloj(segundosRestantes(a))}</span></span> · ${Object.keys(a.respuestas).length}/${a.preguntas.length} respondidas</div>
         <button class="btn btn-solido" id="simContinuar">Continuar ▶</button>
       </div>`
    : "";

  cont.innerHTML = `
    <section class="sim-home">
      <div class="sim-hero">
        <div class="sim-hero-icono">⏱️</div>
        <h2>Simulacro de examen</h2>
        <p>${totalPreg} preguntas · ${a ? a.minutos : Math.max(5, Math.round((SIMULACRO.minutos * totalPreg) / SIMULACRO.totalPreguntas))} min · sin retroalimentación hasta el final. Las preguntas se reparten según el peso de cada sección en el examen, con prioridad a lo más importante.</p>
      </div>
      ${enCurso}
      ${parcial ? `<div class="banner-estado banner-aviso"><span>Simulacro <strong>parcial</strong>: solo representa el ${cobertura}% del examen real porque aún faltan ejercicios en ${SECCIONES.filter((s) => disp.porSeccion[s.id] < s.pesoExamen).map((s) => s.id).join(", ")}. El puntaje sirve de guía, no de predicción.</span></div>` : ""}
      <h4 class="sim-sub">Reparto de preguntas</h4>
      <div class="sim-pesos">${filas}</div>
      <button class="btn btn-solido full" id="simIniciar" ${puede && !a ? "" : "disabled"}>${a ? "Ya tienes uno en curso" : puede ? "▶ Comenzar simulacro" : `Necesitas al menos ${SIMULACRO.minimoParaIniciar} ejercicios cargados`}</button>
      <p class="ajustes-nota">Referencia: ${SIMULACRO.aprobadoPct}% ≈ 700/1000. Microsoft no publica cómo escala el puntaje ni cuántas preguntas tiene AI-901; tómalo como una guía, no como una garantía.</p>
      <h4 class="sim-sub">Historial</h4>
      <div class="sim-hist">${hist}</div>
    </section>`;

  cont.querySelector("#simIniciar")?.addEventListener("click", () => {
    if (!iniciarSimulacro()) return;
    _simVista = "pregunta";
    renderSimulacro();
  });
  cont.querySelector("#simContinuar")?.addEventListener("click", () => { _simVista = "pregunta"; renderSimulacro(); });
  cont.querySelectorAll("[data-res]").forEach((b) => b.addEventListener("click", () => { _simVista = "resultados"; _simResultadoId = b.dataset.res; renderSimulacro(); }));
  if (a) iniciarTemporizadorSim();
}

// ---- Pregunta ----

function responderBotonSimulacro(cont) {
  // El renderizador repinta sus botones en cada toque: se renombra "Comprobar"
  // por "Responder" cada vez (el simulacro no califica a la vista).
  const ajustar = () => {
    const b = cont.querySelector("#btnComprobar");
    if (b && !b.dataset.sim) { b.dataset.sim = "1"; b.textContent = "Responder ▶"; }
  };
  new MutationObserver(ajustar).observe(cont, { childList: true, subtree: true });
  ajustar();
}

function renderSimPregunta(cont) {
  const a = AppState.simulacros.actual;
  if (!a) { _simVista = "home"; return renderSimulacro(); }
  const total = a.preguntas.length;
  a.indice = Math.min(Math.max(0, a.indice), total - 1);
  const q = a.preguntas[a.indice];
  const ejercicio = buscarEjercicio(q.exerciseId, q.seccion);
  const respondida = !!a.respuestas[q.exerciseId];
  const marcada = !!a.marcadas[q.exerciseId];

  cont.innerHTML = `
    <div class="sim-top">
      <div class="sim-timer ${segundosRestantes(a) <= 300 ? "poco" : ""}">⏱ <span class="sim-timer-valor">${formatoReloj(segundosRestantes(a))}</span></div>
      <div class="sim-contador">Pregunta ${a.indice + 1} de ${total}</div>
      <button class="sim-flag ${marcada ? "activa" : ""}" id="simMarcar" aria-label="Marcar para revisar">⚑</button>
    </div>
    <div class="sim-barra"><div style="width:${(Object.keys(a.respuestas).length / total) * 100}%"></div></div>
    ${respondida ? `<div class="sim-ya">✔ Ya respondiste esta pregunta. Si respondes otra vez, la nueva respuesta la reemplaza.</div>` : ""}
    <div id="simPregunta"></div>
    <div class="sim-nav">
      <button class="btn" id="simAnterior" ${a.indice === 0 ? "disabled" : ""}>◀ Anterior</button>
      <button class="btn" id="simResumenBtn">▦ Resumen</button>
      <button class="btn" id="simSaltar">${a.indice === total - 1 ? "Al resumen" : "Saltar ▶"}</button>
    </div>`;

  const cp = cont.querySelector("#simPregunta");
  if (!ejercicio) {
    cp.innerHTML = `<p class="aviso-vacio">Este ejercicio ya no existe en el banco (se actualizó). Sáltalo.</p>`;
  } else {
    renderEjercicio(ejercicio, cp, (respuesta) => {
      const r = calificarEjercicio(ejercicio, respuesta);
      a.respuestas[q.exerciseId] = { respuesta, correcto: !!r.correcto };
      guardar();
      avanzarSimulacro();
    });
    responderBotonSimulacro(cp);
  }

  cont.querySelector("#simMarcar").addEventListener("click", () => {
    a.marcadas[q.exerciseId] = !a.marcadas[q.exerciseId];
    if (!a.marcadas[q.exerciseId]) delete a.marcadas[q.exerciseId];
    guardarConDebounce();
    cont.querySelector("#simMarcar").classList.toggle("activa", !!a.marcadas[q.exerciseId]);
  });
  cont.querySelector("#simAnterior").addEventListener("click", () => { a.indice--; guardarConDebounce(); renderSimulacro(); });
  cont.querySelector("#simSaltar").addEventListener("click", () => {
    if (a.indice >= total - 1) _simVista = "resumen"; else a.indice++;
    guardarConDebounce();
    renderSimulacro();
  });
  cont.querySelector("#simResumenBtn").addEventListener("click", () => { _simVista = "resumen"; renderSimulacro(); });
  iniciarTemporizadorSim();
}

// Tras responder: va a la siguiente sin responder (circular); si ya no hay, al resumen.
function avanzarSimulacro() {
  const a = AppState.simulacros.actual;
  const total = a.preguntas.length;
  for (let paso = 1; paso <= total; paso++) {
    const j = (a.indice + paso) % total;
    if (!a.respuestas[a.preguntas[j].exerciseId]) {
      a.indice = j;
      guardarConDebounce();
      return renderSimulacro();
    }
  }
  _simVista = "resumen";
  renderSimulacro();
}

// ---- Resumen previo a entregar ----

function renderSimResumen(cont) {
  const a = AppState.simulacros.actual;
  if (!a) { _simVista = "home"; return renderSimulacro(); }
  const total = a.preguntas.length;
  const respondidas = Object.keys(a.respuestas).length;
  const marcadas = Object.keys(a.marcadas).length;
  const chips = a.preguntas.map((q, i) => {
    const cls = [a.respuestas[q.exerciseId] ? "resp" : "vacio", a.marcadas[q.exerciseId] ? "marc" : "", i === a.indice ? "actual" : ""].join(" ");
    return `<button class="sim-chip ${cls}" data-i="${i}">${i + 1}${a.marcadas[q.exerciseId] ? "<i>⚑</i>" : ""}</button>`;
  }).join("");

  cont.innerHTML = `
    <div class="sim-top">
      <div class="sim-timer ${segundosRestantes(a) <= 300 ? "poco" : ""}">⏱ <span class="sim-timer-valor">${formatoReloj(segundosRestantes(a))}</span></div>
      <div class="sim-contador">Resumen</div>
      <span></span>
    </div>
    <p class="sim-resumen-txt"><strong>${respondidas}</strong> de ${total} respondidas${marcadas ? ` · <strong>${marcadas}</strong> marcadas ⚑` : ""}${respondidas < total ? ` · <span class="txt-alerta">${total - respondidas} sin responder</span>` : ""}</p>
    <div class="sim-mapa">${chips}</div>
    <div class="sim-leyenda"><span><i class="resp"></i> respondida</span><span><i class="vacio"></i> sin responder</span><span><i class="marc"></i> marcada</span></div>
    <button class="btn btn-solido full" id="simEntregar">Entregar simulacro</button>
    <button class="btn full" id="simVolver">← Volver a las preguntas</button>
    <button class="btn btn-peligro full" id="simAbandonar">Abandonar sin entregar</button>`;

  cont.querySelectorAll(".sim-chip").forEach((b) => b.addEventListener("click", () => { a.indice = parseInt(b.dataset.i, 10); _simVista = "pregunta"; guardarConDebounce(); renderSimulacro(); }));
  cont.querySelector("#simVolver").addEventListener("click", () => { _simVista = "pregunta"; renderSimulacro(); });
  cont.querySelector("#simEntregar").addEventListener("click", () => {
    const faltan = total - respondidas;
    if (faltan && !confirm(`Te faltan ${faltan} pregunta(s) sin responder y contarán como incorrectas. ¿Entregar de todos modos?`)) return;
    const r = finalizarSimulacro(false);
    _simVista = "resultados";
    _simResultadoId = r?.id || null;
    renderSimulacro();
  });
  cont.querySelector("#simAbandonar").addEventListener("click", () => {
    if (!confirm("¿Abandonar el simulacro? Se descarta sin guardar el resultado.")) return;
    abandonarSimulacro();
    _simVista = "home";
    renderSimulacro();
  });
  iniciarTemporizadorSim();
}

// ---- Resultados ----

function anilloPuntaje(pct, aprobado) {
  const r = 52, c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  const color = aprobado ? "var(--success)" : "var(--danger)";
  const ref = SIMULACRO.aprobadoPct;
  const ang = (ref / 100) * 2 * Math.PI - Math.PI / 2;
  const mx = 60 + (r + 0) * Math.cos(ang), my = 60 + (r + 0) * Math.sin(ang);
  return `<svg class="anillo" viewBox="0 0 120 120" role="img" aria-label="${pct}%">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
    <circle cx="${mx}" cy="${my}" r="3.5" fill="var(--text)"/>
    <text x="60" y="62" text-anchor="middle" class="anillo-pct">${pct}%</text>
    <text x="60" y="80" text-anchor="middle" class="anillo-sub">${aprobado ? "por encima de " + ref + "%" : "meta " + ref + "%"}</text>
  </svg>`;
}

function filaBarra(etiqueta, a, t, extra) {
  const pct = t ? Math.round((a / t) * 100) : 0;
  const cls = pct >= SIMULACRO.aprobadoPct ? "ok" : pct >= 50 ? "medio" : "mal";
  return `<div class="res-fila"><span class="res-fila-et">${etiqueta}</span><div class="res-barra"><div class="${cls}" style="width:${pct}%"></div></div><span class="res-fila-n">${a}/${t}${extra || ""}</span></div>`;
}

function textoHabilidad(clave) {
  const [seccion, id] = clave.split(":");
  return (HABILIDADES[seccion] || []).find((h) => h.id === id)?.texto || id;
}

function renderSimResultados(cont, resId) {
  const r = AppState.simulacros.historial.find((x) => x.id === resId) || AppState.simulacros.historial[AppState.simulacros.historial.length - 1];
  if (!r) { _simVista = "home"; return renderSimHome(cont); }

  const dom = DOMINIOS.map((d) => {
    const v = r.porDominio[d.id] || { t: 0, a: 0 };
    return v.t ? filaBarra(`D${d.id} · ${escHTML(d.titulo)} <small>(${d.pesoOficial})</small>`, v.a, v.t) : "";
  }).join("");
  const sec = SECCIONES.filter((s) => r.porSeccion[s.id]).map((s) => filaBarra(`${s.id} · ${escHTML(s.titulo)}`, r.porSeccion[s.id].a, r.porSeccion[s.id].t)).join("");

  const habilidades = Object.entries(r.porHabilidad)
    .map(([k, v]) => ({ k, ...v, pct: v.a / v.t }))
    .filter((h) => h.pct < 1)
    .sort((x, y) => x.pct - y.pct || y.t - x.t)
    .slice(0, 5)
    .map((h) => `<li><span>${escHTML(textoHabilidad(h.k))}</span><b>${h.a}/${h.t}</b></li>`)
    .join("");

  const falladas = r.detalle.filter((d) => !d.correcto);
  const lista = falladas.map((d, idx) => {
    const ej = buscarEjercicio(d.id, d.seccion);
    if (!ej) return `<details class="res-fallo"><summary><span class="res-fallo-sec">${d.seccion}</span> (ejercicio ya no existe en el banco)</summary></details>`;
    const titulo = ej.type === "dropdown" || ej.type === "code-fill" ? (ej.prompt || ej.textWithBlanks || "") : ej.statement || ej.prompt;
    const codigo = ej.type === "code-fill" ? renderSolucionCodeFill(ej, d.respuesta) : ej.code ? renderCodigoDeEjercicio(ej) : "";
    return `
      <details class="res-fallo">
        <summary><span class="res-fallo-sec">${d.seccion}</span> ${fmtTxt(String(titulo).slice(0, 140))}</summary>
        <div class="res-fallo-cuerpo">
          ${ej.type === "dropdown" ? `<p class="res-linea">${fmtTxt(ej.textWithBlanks)}</p>` : ""}
          ${codigo}
          <p class="res-linea"><b>Tu respuesta:</b> ${d.respondida ? fmtTxt(formatearRespuestaUsuario(ej, d.respuesta)) : "<em>sin responder</em>"}</p>
          <p class="res-linea"><b>Correcta:</b> ${fmtTxt(formatearRespuestaEsperada(ej))}</p>
          <p class="res-expl">${fmtTxt(ej.explanation || "")}</p>
        </div>
      </details>`;
  }).join("");

  const mins = Math.floor(r.usadoSeg / 60), segs = r.usadoSeg % 60;
  cont.innerHTML = `
    <section class="sim-res">
      <button class="btn-icono sim-res-volver" id="simResHome" aria-label="Volver al inicio del simulacro">←</button>
      <div class="sim-res-hero ${r.aprobado ? "ok" : "mal"}">
        ${anilloPuntaje(r.pct, r.aprobado)}
        <div>
          <div class="sim-res-titulo">${r.aprobado ? "Por encima de la meta" : "Todavía por debajo de la meta"}</div>
          <div class="sim-res-sub">${r.aciertos} de ${r.total} correctas · ${mins} min ${String(segs).padStart(2, "0")} s${r.porTiempo ? " · ⏰ se acabó el tiempo" : ""}</div>
          ${r.cobertura < 100 ? `<div class="sim-res-sub">Simulacro parcial (≈${r.cobertura}% del examen real)</div>` : ""}
        </div>
      </div>
      <h4 class="sim-sub">Por dominio</h4>${dom}
      <h4 class="sim-sub">Por sección</h4>${sec}
      ${habilidades ? `<h4 class="sim-sub">Habilidades oficiales a reforzar</h4><ul class="res-habs">${habilidades}</ul>` : ""}
      <div class="sim-res-acciones">
        ${falladas.length ? `<button class="btn btn-solido" id="simRepasar">🔁 Repasar las ${falladas.length} falladas</button>` : `<div class="banner-estado banner-exito">🎉 Sin errores en este simulacro</div>`}
        <button class="btn" id="simCopiar">📋 Copiar reporte</button>
        <button class="btn" id="simOtro">▶ Nuevo simulacro</button>
      </div>
      ${falladas.length ? `<h4 class="sim-sub">Falladas (${falladas.length})</h4>${lista}` : ""}
      <p class="ajustes-nota">Referencia ${SIMULACRO.aprobadoPct}% ≈ 700/1000: Microsoft no publica la fórmula de escalado, úsalo como guía.</p>
    </section>`;

  cont.querySelector("#simResHome").addEventListener("click", () => { _simVista = "home"; renderSimulacro(); });
  cont.querySelector("#simOtro")?.addEventListener("click", () => {
    if (AppState.simulacros.actual) { _simVista = "home"; return renderSimulacro(); }
    if (!iniciarSimulacro()) { window._toast?.("No hay suficientes ejercicios cargados"); return; }
    _simVista = "pregunta";
    renderSimulacro();
  });
  cont.querySelector("#simCopiar")?.addEventListener("click", () => {
    const texto = construirReporteSimulacro(r);
    (navigator.clipboard?.writeText(texto) || Promise.reject()).then(() => window._toast?.("📋 Reporte copiado")).catch(() => window._toast?.("No se pudo copiar"));
  });
  cont.querySelector("#simRepasar")?.addEventListener("click", () => {
    _simRepaso = { cola: falladas.map((d) => ({ id: d.id, seccion: d.seccion })), i: 0, resultadoId: r.id };
    _simVista = "repaso";
    renderSimulacro();
  });
}

function construirReporteSimulacro(r) {
  const l = [];
  l.push(`Simulacro AI-901 — ${new Date(r.fechaISO).toLocaleString("es-CO")}`);
  l.push(`Puntaje: ${r.pct}% (${r.aciertos}/${r.total}) · meta ${SIMULACRO.aprobadoPct}% · ${Math.round(r.usadoSeg / 60)} min${r.cobertura < 100 ? ` · parcial ≈${r.cobertura}% del examen` : ""}`);
  l.push("", "Por dominio:");
  DOMINIOS.forEach((d) => { const v = r.porDominio[d.id]; if (v) l.push(`  Dominio ${d.id} (${d.pesoOficial}): ${v.a}/${v.t}`); });
  l.push("", "Por sección:");
  SECCIONES.forEach((s) => { const v = r.porSeccion[s.id]; if (v) l.push(`  ${s.id} ${s.titulo}: ${v.a}/${v.t}`); });
  const flojas = Object.entries(r.porHabilidad).filter(([, v]) => v.a < v.t).sort((x, y) => x[1].a / x[1].t - y[1].a / y[1].t).slice(0, 6);
  if (flojas.length) { l.push("", "Habilidades a reforzar:"); flojas.forEach(([k, v]) => l.push(`  ${textoHabilidad(k)}: ${v.a}/${v.t}`)); }
  const falladas = r.detalle.filter((d) => !d.correcto);
  if (falladas.length) {
    l.push("", "Respuestas equivocadas:");
    falladas.forEach((d, i) => {
      const ej = buscarEjercicio(d.id, d.seccion);
      if (!ej) return;
      l.push(`${i + 1}. [${d.seccion}] ${ej.statement || ej.prompt || ej.textWithBlanks}`);
      l.push(`   Tu respuesta: ${d.respondida ? formatearRespuestaUsuario(ej, d.respuesta) : "(sin responder)"}`);
      l.push(`   Respuesta esperada: ${formatearRespuestaEsperada(ej)}`);
    });
  }
  return l.join("\n");
}

// ---- Repaso de falladas (con retroalimentación) ----

function renderSimRepaso(cont) {
  const rp = _simRepaso;
  if (!rp || rp.i >= rp.cola.length) {
    _simVista = "resultados";
    _simResultadoId = rp?.resultadoId || null;
    window._toast?.("🎉 Repaso terminado");
    return renderSimulacro();
  }
  const item = rp.cola[rp.i];
  const ej = buscarEjercicio(item.id, item.seccion);
  if (!ej) { rp.i++; return renderSimRepaso(cont); }
  cont.innerHTML = `
    <div class="sim-top">
      <button class="btn" id="simSalirRepaso">← Salir</button>
      <div class="sim-contador">Repaso ${rp.i + 1} de ${rp.cola.length}</div>
      <span></span>
    </div>
    <div id="simPregunta"></div>`;
  cont.querySelector("#simSalirRepaso").addEventListener("click", () => { _simVista = "resultados"; _simResultadoId = rp.resultadoId; renderSimulacro(); });
  renderEjercicio(ej, cont.querySelector("#simPregunta"), (respuesta) => {
    const r = calificarEjercicio(ej, respuesta);
    mostrarModalFeedback({
      exercise: ej,
      correcto: r.correcto,
      respuestaUsuario: respuesta,
      onContinuar: () => { rp.i++; renderSimRepaso(cont); },
      onRepasar: () => { rp.cola.push(item); rp.i++; renderSimRepaso(cont); },
    });
  });
}


// motor/modal.js
//
// Modal que se muestra DESPUÉS de responder cualquier ejercicio (de los 6
// tipos, calificable o no). Siempre ofrece [Continuar] y [Repasar] — el
// usuario puede mandar a repasar incluso una respuesta correcta.
//
// Para ejercicios de texto-libre en modo "reflexion" (sin respuesta
// correcta), se pasa esReflexion:true y el modal muestra un estado neutral
// ("guardado") en vez de ✅/❌.

function mostrarModalFeedback({ exercise, correcto, esReflexion, respuestaUsuario, onContinuar, onRepasar }) {
  const existente = document.querySelector(".modal-overlay");
  if (existente) existente.remove();

  const clase = esReflexion ? "feedback-reflexion" : correcto ? "feedback-correcto" : "feedback-incorrecto";
  const icono = esReflexion ? "💭" : correcto ? "✅" : "❌";
  const titulo = esReflexion ? "Respuesta guardada" : correcto ? "¡Correcto!" : "No era esa";

  const modal = document.createElement("div");
  modal.className = "modal-overlay modal-activo";
  modal.innerHTML = `
    <div class="modal-tarjeta modal-feedback ${clase}">
      <div class="feedback-encabezado">
        <span class="feedback-icono">${icono}</span>
        <span class="feedback-titulo">${titulo}</span>
      </div>
      ${exercise?.type === "code-fill" && !esReflexion ? `<div class="feedback-codigo">${renderSolucionCodeFill(exercise, respuestaUsuario)}</div>` : ""}
      <p class="feedback-explicacion">${fmtTxt(exercise?.explanation || (esReflexion ? "Podrás revisar todas tus reflexiones desde la pantalla de Conceptos." : ""))}</p>
      <div class="modal-botones">
        <button class="btn" id="btnRepasar">🔁 Repasar</button>
        <button class="btn btn-solido" id="btnContinuar">Continuar ▶</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const cerrar = () => modal.remove();
  modal.querySelector("#btnContinuar").addEventListener("click", () => { cerrar(); onContinuar?.(); });
  modal.querySelector("#btnRepasar").addEventListener("click", () => { cerrar(); onRepasar?.(); });
}


// motor/mapa.js
//
// Dos vistas:
//  1) renderSecciones(): pantalla principal, agrupada por dominio (1 y 2),
//     con cada sección mostrando su total oficial y si está "(Vacío)".
//  2) renderLecciones(): dentro de una sección, la caja de lecciones
//     (máx. 10 ejercicios cada una) + acceso a "Aprendizaje" + botón de
//     reporte (habilitado desde la lección 5).
//
// Este módulo solo pinta HTML y dispara callbacks; toda la lógica de datos
// vive en storage.js.

// NOTA: sin `import` — este archivo se concatena después de temario.js y
// storage.js (ver MOTOR_JS_FILES en build.py), así que DOMINIOS,
// seccionesDeDominio, getSeccion, LECCIONES_PARA_HABILITAR_REPORTE,
// getSeccionState y seccionTieneDatos ya existen en el mismo scope.

function iconoEstadoSeccion(estado, tieneDatos) {
  if (!tieneDatos) return "🔒";
  if (estado === "aprobado") return "✅";
  if (estado === "requiere-reintento") return "🔁";
  if (estado === "en-progreso") return "▶️";
  return "🟦";
}

function etiquetaEstadoSeccion(estado, tieneDatos, mejorPuntajePct) {
  if (!tieneDatos) return "Vacío";
  if (estado === "aprobado") return `Aprobada · ${mejorPuntajePct}%`;
  if (estado === "requiere-reintento") return `Reintentar · ${mejorPuntajePct}%`;
  if (estado === "en-progreso") return "En progreso";
  return "Disponible";
}

// Fracción (0..1) de ejercicios de una sección cuyo ÚLTIMO resultado fue correcto.
function avanceSeccion(seccionId) {
  const e = getSeccionState(seccionId);
  if (!e.ejercicios.length) return 0;
  const ok = Object.values(e.progreso.resultadoPorEjercicio || {}).filter((v) => v === true).length;
  return ok / e.ejercicios.length;
}

// La sección donde más conviene estudiar ahora: la que más pesa en el examen
// y menos avance lleva (solo entre las que ya tienen ejercicios y no están aprobadas).
function seccionRecomendada() {
  let mejor = null;
  let mejorScore = -1;
  SECCIONES.forEach((s) => {
    if (!seccionTieneDatos(s.id)) return;
    if (getSeccionState(s.id).progreso.estado === "aprobado") return;
    const score = s.pesoExamen * (1 - avanceSeccion(s.id));
    if (score > mejorScore) { mejorScore = score; mejor = s.id; }
  });
  return mejor;
}

function pctExamen(s) {
  return Math.round((s.pesoExamen / SIMULACRO.totalPreguntas) * 100);
}

export function renderSecciones(callbacks) {
  const cont = document.getElementById("seccionesContainer");
  if (!cont) return;

  const recomendada = seccionRecomendada();
  const bloques = DOMINIOS.map((dominio) => {
    const secciones = seccionesDeDominio(dominio.id);
    const tarjetas = secciones
      .map((s) => {
        const estadoSeccion = getSeccionState(s.id);
        const tieneDatos = seccionTieneDatos(s.id);
        const cargando = !estadoSeccion.cargada;
        const icono = iconoEstadoSeccion(estadoSeccion.progreso.estado, tieneDatos);
        const etiqueta = cargando ? "Cargando…" : etiquetaEstadoSeccion(estadoSeccion.progreso.estado, tieneDatos, estadoSeccion.progreso.mejorPuntajePct);
        const bloqueada = !tieneDatos;
        const cargados = estadoSeccion.ejercicios.length;
        const textoEjercicios = !tieneDatos
          ? `${s.totalEjercicios} ejercicios previstos`
          : cargados < s.totalEjercicios
          ? `${cargados} de ${s.totalEjercicios} ejercicios`
          : `${cargados} ejercicios`;
        const esRecomendada = s.id === recomendada;

        return `
          <button class="tarjeta-seccion ${bloqueada ? "bloqueada" : ""} ${esRecomendada ? "recomendada" : ""}" data-seccion="${s.id}" ${bloqueada ? "disabled" : ""}>
            <div class="tarjeta-seccion-top">
              <span class="tarjeta-seccion-id">${s.id}</span>
              <span class="tarjeta-seccion-icono">${icono}</span>
            </div>
            <div class="tarjeta-seccion-titulo">${escHTML(s.titulo)}</div>
            <div class="peso-examen" title="Preguntas de cada 100 del examen que salen de esta sección">
              <div class="peso-examen-barra"><div class="peso-examen-fill" style="width:${Math.min(100, pctExamen(s) * 4)}%"></div></div>
              <span>≈ ${pctExamen(s)} % del examen</span>
            </div>
            <div class="tarjeta-seccion-meta">
              <span>${textoEjercicios}</span>
              <span class="tarjeta-seccion-estado">${esRecomendada ? "👉 Empieza aquí" : etiqueta}</span>
            </div>
          </button>
        `;
      })
      .join("");

    return `
      <section class="bloque-dominio">
        <header class="bloque-dominio-header">
          <h2>${dominio.id}. ${escHTML(dominio.titulo)}</h2>
          <span class="bloque-dominio-peso">${dominio.pesoOficial} del examen · ${seccionesDeDominio(dominio.id).reduce((t, s) => t + (getSeccionState(s.id).ejercicios.length || 0), 0)}/${dominio.totalEjercicios} ejercicios</span>
        </header>
        <div class="grid-secciones">${tarjetas}</div>
      </section>
    `;
  }).join("");

  cont.innerHTML = bloques;

  cont.querySelectorAll(".tarjeta-seccion[data-seccion]").forEach((btn) => {
    btn.addEventListener("click", () => callbacks.onAbrirSeccion(btn.dataset.seccion));
  });
}

export function renderLecciones(seccionId, callbacks) {
  const cont = document.getElementById("leccionesContainer");
  if (!cont) return;

  const estado = getSeccionState(seccionId);
  const intento = estado.progreso.intentoActual;
  const lecciones = intento?.lecciones || [];

  let primeraNoCompletada = lecciones.findIndex((l) => !l.completada);
  if (primeraNoCompletada === -1) primeraNoCompletada = lecciones.length;

  const cajas = lecciones
    .map((l, idx) => {
      const originales = l.cola.map((item, i) => ({ ...item, i })).filter((item) => !item.excluido);
      const total = originales.length; // cuántos ejercicios "cuenta" nominalmente esta lección (fijo, no cambia con [Repasar])
      const hechos = originales.filter((item) => l.resultados[item.i] !== undefined).length; // para la barra de progreso
      // aciertos: igual que en verificarCierreIntento (sesion.js) — se basa
      // en resultados[i].excluido (lo comprometido), no en item.excluido,
      // porque un ítem ORIGINAL marcado [Repasar] queda excluido del
      // puntaje aunque su posición en `cola` siga con excluido=false.
      const aciertos = originales.filter((item) => {
        const r = l.resultados[item.i];
        return r && !r.excluido && r.correcto;
      }).length;
      const completada = l.completada;
      const actual = idx === primeraNoCompletada;
      const bloqueada = idx > primeraNoCompletada;
      const pct = total ? Math.round((hechos / total) * 100) : 0;

      return `
        <button class="caja-leccion ${completada ? "completada" : ""} ${actual ? "actual" : ""} ${bloqueada ? "bloqueada" : ""}"
                data-leccion="${idx}" ${bloqueada ? "disabled" : ""}>
          <div class="caja-leccion-numero">${bloqueada ? "🔒" : completada ? "✓" : idx + 1}</div>
          ${bloqueada ? "" : `<div class="caja-leccion-barra"><div class="caja-leccion-barra-fill" style="width:${pct}%"></div></div>`}
          <div class="caja-leccion-info">
            ${completada ? `${aciertos}/${total}` : bloqueada ? "Bloqueada" : `${total} ejercicios`}
          </div>
        </button>
      `;
    })
    .join("");

  const meta = getSeccion(seccionId);
  const nombreSeccion = document.getElementById("leccionesTitulo");
  if (nombreSeccion) nombreSeccion.textContent = `${seccionId} · ${meta ? meta.titulo : ""}`;

  const reporteHabilitado = estado.progreso.leccionesCompletadas >= LECCIONES_PARA_HABILITAR_REPORTE;
  const btnReporte = document.getElementById("btnCopiarReporteSeccion");
  if (btnReporte) btnReporte.disabled = !reporteHabilitado;

  const banner = renderBannerEstadoSeccion(estado, seccionId, callbacks);

  cont.innerHTML = banner + (lecciones.length
    ? `<div class="grid-lecciones">${cajas}</div>`
    : `<div class="aviso-vacio">Esta sección todavía no tiene ejercicios cargados.</div>`);

  cont.querySelectorAll(".caja-leccion[data-leccion]").forEach((btn) => {
    btn.addEventListener("click", () => callbacks.onAbrirLeccion(seccionId, parseInt(btn.dataset.leccion, 10)));
  });

  const btnReintentar = cont.querySelector("#btnGenerarReintento");
  if (btnReintentar) {
    btnReintentar.addEventListener("click", () => callbacks.onGenerarReintento(seccionId));
  }
}

function renderBannerEstadoSeccion(estado, seccionId, callbacks) {
  const p = estado.progreso;
  const ultimo = p.intentos[p.intentos.length - 1];
  const detalleIntento = ultimo && ultimo.totalSeccion
    ? ` <small>(${ultimo.correctosSeccion}/${ultimo.totalSeccion} ejercicios de la sección${ultimo.esReintento ? ` · este reintento: ${ultimo.pctIntento}%` : ""})</small>`
    : "";
  if (p.estado === "aprobado") {
    return `<div class="banner-estado banner-exito">✅ Sección aprobada con ${ultimo ? ultimo.pct : p.mejorPuntajePct}%${detalleIntento}</div>`;
  }
  if (p.estado === "requiere-reintento") {
    const pct = ultimo ? ultimo.pct : p.mejorPuntajePct;
    const sinCal = ultimo ? ultimo.sinCalificar || 0 : 0;
    const mensaje = pct >= UMBRAL_APROBACION_PCT && sinCal > 0
      ? `🔁 Vas en ${pct}%, pero te faltan ${sinCal} ejercicio(s) por calificar (los que mandaste a Repasar).`
      : `🔁 La sección va en ${pct}% y necesitas ${UMBRAL_APROBACION_PCT}%.${sinCal ? ` Además faltan ${sinCal} ejercicio(s) por calificar.` : ""}`;
    return `
      <div class="banner-estado banner-alerta">
        <span>${mensaje}${detalleIntento} El reintento incluye lo que fallaste y lo que falta calificar.</span>
        <button class="btn btn-solido" id="btnGenerarReintento">Generar reintento</button>
      </div>
    `;
  }
  return "";
}

function escHTML(str) {
  const div = document.createElement("div");
  div.textContent = String(str ?? "");
  return div.innerHTML;
}


// motor/ajustes.js
//
// Modal de configuración (⚙️). Incluye:
//  - 🔍 Analizar: re-consulta TODOS los .json de datos/ (para cuando vas
//    agregando ejercicios poco a poco) y muestra cuántos nuevos encontró.
//  - Reiniciar el progreso de una sección puntual, o de todas.
//  - Exportar / importar el progreso completo como archivo .json.

// NOTA: sin `import` — este archivo se concatena al final de motor/ (ver
// MOTOR_JS_FILES en build.py), así que SECCIONES (temario.js), AppState,
// analizarTodo, reiniciarProgresoSeccion, reiniciarTodoElProgreso,
// exportarProgreso, importarProgreso (storage.js) y escHTML (mapa.js) ya
// existen en el mismo scope.

export function mostrarModalAjustes({ onCambios }) {
  const existente = document.querySelector(".modal-overlay");
  if (existente) existente.remove();

  const opcionesSecciones = SECCIONES.map((s) => `<option value="${s.id}">${s.id} · ${escHTML(s.titulo)}</option>`).join("");

  const modal = document.createElement("div");
  modal.className = "modal-overlay modal-activo";
  modal.innerHTML = `
    <div class="modal-tarjeta modal-ajustes">
      <div class="modal-ajustes-header">
        <h3>⚙️ Ajustes</h3>
        <button class="modal-cerrar" id="ajustesCerrar" aria-label="Cerrar">✕</button>
      </div>

      <div class="ajustes-seccion">
        <h4>Datos</h4>
        <button class="btn-ajustes" id="btnAnalizar">🔍 Analizar archivos de datos/</button>
        <p class="ajustes-nota" id="analizarResultado"></p>
      </div>

      <div class="ajustes-seccion">
        <h4>Progreso</h4>
        <div class="ajustes-fila">
          <select id="selectSeccionReset" class="select-ajustes">${opcionesSecciones}</select>
          <button class="btn-ajustes btn-peligro" id="btnResetSeccion">Reiniciar sección</button>
        </div>
        <button class="btn-ajustes btn-peligro full" id="btnResetTodo">🗑️ Reiniciar todo el progreso</button>
      </div>

      <div class="ajustes-seccion">
        <h4>Respaldo</h4>
        <div class="ajustes-fila">
          <button class="btn-ajustes" id="btnExportar">⬇️ Exportar progreso</button>
          <button class="btn-ajustes" id="btnImportar">⬆️ Importar progreso</button>
        </div>
        <input type="file" id="inputImportar" accept="application/json" style="display:none;">
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const cerrar = () => modal.remove();
  modal.querySelector("#ajustesCerrar").addEventListener("click", cerrar);
  modal.addEventListener("click", (e) => { if (e.target === modal) cerrar(); });

  modal.querySelector("#btnAnalizar").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = "🔍 Analizando…";
    const resultados = await analizarTodo();
    btn.disabled = false;
    btn.textContent = "🔍 Analizar archivos de datos/";
    const totalNuevos = resultados.reduce((sum, r) => sum + Math.max(0, r.nuevos), 0);
    const resumen = resultados
      .filter((r) => r.total > 0)
      .map((r) => `${r.id}: ${r.total} ejercicio(s)${r.nuevos > 0 ? ` (+${r.nuevos} nuevos)` : ""}`)
      .join(" · ") || "Todos los archivos siguen vacíos.";
    document.getElementById("analizarResultado").textContent =
      totalNuevos > 0 ? `✅ ${resumen}` : resumen;
    onCambios?.();
  });

  modal.querySelector("#btnResetSeccion").addEventListener("click", () => {
    const id = document.getElementById("selectSeccionReset").value;
    if (confirm(`¿Reiniciar todo el progreso de ${id}? Esto no se puede deshacer.`)) {
      reiniciarProgresoSeccion(id);
      onCambios?.();
      cerrar();
    }
  });

  modal.querySelector("#btnResetTodo").addEventListener("click", () => {
    if (confirm("¿Reiniciar TODO el progreso de la app? Esto no se puede deshacer.")) {
      reiniciarTodoElProgreso();
      onCambios?.();
      cerrar();
    }
  });

  modal.querySelector("#btnExportar").addEventListener("click", () => {
    const contenido = exportarProgreso();
    const blob = new Blob([contenido], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ai901-progreso-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  const inputImportar = modal.querySelector("#inputImportar");
  modal.querySelector("#btnImportar").addEventListener("click", () => inputImportar.click());
  inputImportar.addEventListener("change", async () => {
    const file = inputImportar.files?.[0];
    if (!file) return;
    try {
      const texto = await file.text();
      importarProgreso(texto);
      onCambios?.();
      cerrar();
      window._toast?.("✅ Progreso importado");
    } catch (err) {
      window._toast?.("❌ Archivo inválido: " + err.message);
    }
  });
}

// tipos-ejercicio/single-select.js
// Selección múltiple con ÚNICA respuesta correcta. Las opciones se barajan
// en cada render (antes la correcta siempre salía primero).

function renderSingleSelect(exercise, container, onListo) {
  let seleccion = null;
  const opciones = opcionesBarajadas(exercise.options, exercise);
  const mono = !!exercise.opcionesCodigo;
  const dyn = prepararContenedor(container, exercise);

  const pintar = () => {
    dyn.innerHTML = `
      <div class="opciones-lista">
        ${opciones
          .map(
            (o) => `
          <button type="button" class="opcion-btn ${mono ? "opcion-codigo" : ""} ${seleccion === o.id ? "seleccionada" : ""}" data-id="${escAttr(o.id)}">
            ${o.icono ? iconoHTML(o.icono, { tam: "sm" }) : ""}
            <span class="opcion-texto">${mono ? `<code>${escHTML(o.text)}</code>` : fmtTxt(o.text)}</span>
          </button>`
          )
          .join("")}
      </div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar" ${seleccion ? "" : "disabled"}>✅ Comprobar</button>
      </div>
    `;

    dyn.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        seleccion = btn.dataset.id;
        pintar();
      });
    });
    dyn.querySelector("#btnComprobar")?.addEventListener("click", () => {
      if (seleccion) onListo(seleccion);
    });
  };

  pintar();
}

function calificarSingleSelect(exercise, respuesta) {
  return { correcto: respuesta === exercise.correctOptionId };
}


// tipos-ejercicio/multi-select.js
// Selección múltiple con VARIAS respuestas correctas (opciones barajadas).

function renderMultiSelect(exercise, container, onListo) {
  const seleccion = new Set();
  const opciones = opcionesBarajadas(exercise.options, exercise);
  const mono = !!exercise.opcionesCodigo;
  const cuantas = (exercise.correctOptionIds || []).length;
  const nota = exercise.ocultarCantidad ? "Selecciona todas las que apliquen." : `Selecciona las ${cuantas} que apliquen.`;
  const dyn = prepararContenedor(container, exercise);

  const pintar = () => {
    dyn.innerHTML = `
      <p class="ajustes-nota">${nota}</p>
      <div class="opciones-lista">
        ${opciones
          .map(
            (o) => `
          <button type="button" class="opcion-btn opcion-multi ${mono ? "opcion-codigo" : ""} ${seleccion.has(o.id) ? "seleccionada" : ""}" data-id="${escAttr(o.id)}">
            <span class="opcion-check">${seleccion.has(o.id) ? "☑" : "☐"}</span>
            ${o.icono ? iconoHTML(o.icono, { tam: "sm" }) : ""}
            <span class="opcion-texto">${mono ? `<code>${escHTML(o.text)}</code>` : fmtTxt(o.text)}</span>
          </button>`
          )
          .join("")}
      </div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar" ${seleccion.size ? "" : "disabled"}>✅ Comprobar</button>
      </div>
    `;

    dyn.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        if (seleccion.has(id)) seleccion.delete(id);
        else seleccion.add(id);
        pintar();
      });
    });
    dyn.querySelector("#btnComprobar")?.addEventListener("click", () => {
      if (seleccion.size) onListo([...seleccion]);
    });
  };

  pintar();
}

function calificarMultiSelect(exercise, respuesta) {
  const esperado = new Set(exercise.correctOptionIds || []);
  const dado = new Set(respuesta || []);
  if (esperado.size !== dado.size) return { correcto: false };
  for (const id of esperado) if (!dado.has(id)) return { correcto: false };
  return { correcto: true };
}


// tipos-ejercicio/true-false.js
// Verdadero/Falso o Sí/No (mismo tipo, cambia solo el texto de los botones).
// Puede llevar `code` (p. ej. "¿este código imprime X?") o `imagen`.

function renderTrueFalse(exercise, container, onListo) {
  let seleccion = null; // true | false | null
  const labels = exercise.labels || { affirmative: "Verdadero", negative: "Falso" };
  const dyn = prepararContenedor(container, exercise, {

  const pintar = () => {
    dyn.innerHTML = `
      <div class="opciones-lista opciones-vf">

        <button type="button" class="opcion-btn ${seleccion === false ? "seleccionada" : ""}" data-val="false">${escHTML(labels.negative)}</button>
      </div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar" ${seleccion === null ? "disabled" : ""}>✅ Comprobar</button>
      </div>

    dyn.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {

function calificarTrueFalse(exercise, respuesta) {
  return { correcto: !!respuesta === !!exercise.correctAnswer };
}


// tipos-ejercicio/matching.js
//
// Dos modos:
//  - "pairs": relacionar dos columnas — se implementa como TOCAR para
//    conectar (más confiable en móvil que un drag & drop real con mouse/touch
//    mezclados) en vez de arrastrar.
//  - "sequence": ordenar pasos — se implementa con flechas ▲▼ por ítem en
//    vez de arrastrar, para evitar los bugs típicos de drag-and-drop táctil
//    en una sola pasada de HTML/JS sin librerías.


// Contenido de un ítem: texto con `código inline`, una línea de código
// resaltada (item.code) o un icono de Azure (item.icono, item.soloIcono).
function contenidoItemEmparejar(item, lang) {
  if (!item) return "";
  const ic = item.icono ? iconoHTML(item.icono, { tam: "md", conNombre: !item.soloIcono }) : "";
  if (item.soloIcono) return ic;
  const txt = item.code ? `<code class="seq-code">${resaltarLinea(item.text, lang || "python")}</code>` : fmtTxt(item.text);
  return `${ic}<span class="opcion-texto">${txt}</span>`;
}

function renderMatching(exercise, container, onListo) {
  if (exercise.mode === "sequence") return renderMatchingSequence(exercise, container, onListo);
  return renderMatchingPairs(exercise, container, onListo);
}

function calificarMatching(exercise, respuesta) {
  if (exercise.mode === "sequence") {
    const esperado = exercise.correctOrder || [];
    const dado = respuesta || [];
    if (esperado.length !== dado.length) return { correcto: false };
    for (let i = 0; i < esperado.length; i++) if (esperado[i] !== dado[i]) return { correcto: false };
    return { correcto: true };
  }
  const esperado = exercise.correctPairs || [];
  const dado = respuesta || [];
  if (esperado.length !== dado.length) return { correcto: false };
  const mapaEsperado = new Map(esperado.map((p) => [p.leftId, p.rightId]));
  for (const p of dado) if (mapaEsperado.get(p.leftId) !== p.rightId) return { correcto: false };
  return { correcto: true };
}

// ---------------- modo "sequence" (ordenar con flechas) ----------------

function renderMatchingSequence(exercise, container, onListo) {
  const correcto = (exercise.correctOrder || []).join("|");
  let orden = barajarLocal((exercise.items || []).map((i) => i.id));
  for (let k = 0; k < 6 && orden.join("|") === correcto; k++) orden = barajarLocal(orden);
  const dyn = prepararContenedor(container, exercise);

  const mover = (idx, delta) => {
    const j = idx + delta;
    if (j < 0 || j >= orden.length) return;
    [orden[idx], orden[j]] = [orden[j], orden[idx]];
    pintar();
  };

  const pintar = () => {
    const filas = orden
      .map((id, idx) => {
        const item = (exercise.items || []).find((i) => i.id === id);
        return `
          <div class="secuencia-fila">
            <span class="secuencia-numero">${idx + 1}</span>
            <span class="secuencia-texto${item && item.code ? " es-codigo" : ""}">${item ? contenidoItemEmparejar(item, exercise.lang) : escHTML(id)}</span>
            <span class="secuencia-flechas">
              <button type="button" class="btn-icono btn-mini" data-mover="${idx}" data-delta="-1" ${idx === 0 ? "disabled" : ""}>▲</button>
              <button type="button" class="btn-icono btn-mini" data-mover="${idx}" data-delta="1" ${idx === orden.length - 1 ? "disabled" : ""}>▼</button>
            </span>
          </div>
        `;
      })
      .join("");

    dyn.innerHTML = `
      <div class="secuencia-lista">${filas}</div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar">✅ Comprobar</button>
      </div>
    `;

    dyn.querySelectorAll("[data-mover]").forEach((btn) => {
      btn.addEventListener("click", () => mover(parseInt(btn.dataset.mover, 10), parseInt(btn.dataset.delta, 10)));
    });
    dyn.querySelector("#btnComprobar")?.addEventListener("click", () => onListo([...orden]));
  };

  pintar();
}

// ---------------- modo "pairs" (tocar para conectar) ----------------

function renderMatchingPairs(exercise, container, onListo) {
  const pares = {}; // leftId -> rightId
  let leftActivo = null;
  const rightBarajado = barajarLocal((exercise.rightItems || []).map((i) => i.id));
  const dyn = prepararContenedor(container, exercise);

  const badgePara = (leftId) => {
    const idx = Object.keys(pares).indexOf(leftId);
    return idx === -1 ? null : idx + 1;
  };

  const clic = (lado, id) => {
    if (lado === "left") {
      if (pares[id] !== undefined) {
        delete pares[id]; // togglea: si ya estaba pareado, lo libera
        leftActivo = null;
      } else {
        leftActivo = id;
      }
    } else {
      const rightYaUsado = Object.values(pares).includes(id);
      if (rightYaUsado) {
        const leftDeEse = Object.keys(pares).find((l) => pares[l] === id);
        delete pares[leftDeEse];
      } else if (leftActivo) {
        pares[leftActivo] = id;
        leftActivo = null;
      }
    }
    pintar();
  };

  const pintar = () => {
    const izquierda = (exercise.leftItems || [])
      .map((item) => {
        const badge = badgePara(item.id);
        const activo = leftActivo === item.id;
        return `
          <button type="button" class="opcion-btn opcion-emparejar ${badge ? "pareado" : ""} ${activo ? "activo" : ""}" data-lado="left" data-id="${escHTML(item.id)}">
            ${badge ? `<span class="emparejar-badge">${badge}</span>` : ""} ${contenidoItemEmparejar(item, exercise.lang)}
          </button>
        `;
      })
      .join("");

    const derecha = rightBarajado
      .map((id) => {
        const item = (exercise.rightItems || []).find((i) => i.id === id);
        const badge = badgePara(Object.keys(pares).find((l) => pares[l] === id));
        return `
          <button type="button" class="opcion-btn opcion-emparejar ${badge ? "pareado" : ""}" data-lado="right" data-id="${escHTML(id)}">
            ${badge ? `<span class="emparejar-badge">${badge}</span>` : ""} ${item ? contenidoItemEmparejar(item, exercise.lang) : escHTML(id)}
          </button>
        `;
      })
      .join("");

    const totalIzq = (exercise.leftItems || []).length;
    const completo = Object.keys(pares).length === totalIzq;

    dyn.innerHTML = `
      <p class="ajustes-nota">Toca un elemento de la izquierda y luego su pareja a la derecha.</p>
      <div class="emparejar-columnas">
        <div class="emparejar-col">${izquierda}</div>
        <div class="emparejar-col">${derecha}</div>
      </div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar" ${completo ? "" : "disabled"}>✅ Comprobar</button>
      </div>
    `;

    dyn.querySelectorAll("[data-lado]").forEach((btn) => {
      btn.addEventListener("click", () => clic(btn.dataset.lado, btn.dataset.id));
    });
    dyn.querySelector("#btnComprobar")?.addEventListener("click", () => {
      if (completo) onListo(Object.entries(pares).map(([leftId, rightId]) => ({ leftId, rightId })));
    });
  };

  pintar();
}

function barajarLocal(arr) {
  const copia = [...arr];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}


// tipos-ejercicio/dropdown.js
// Completar un enunciado eligiendo de listas desplegables ({{id}} en
// textWithBlanks). Las opciones de cada lista se barajan al abrir el ejercicio.

function renderDropdown(exercise, container, onListo) {
  const seleccionadas = {}; // blankId -> valor
  const opcionesPorBlank = {};
  (exercise.blanks || []).forEach((b) => { opcionesPorBlank[b.id] = opcionesBarajadas(b.options, exercise); });
  const dyn = prepararContenedor(container, exercise, { promptHtml: "" });

  const construirTexto = () => {
    let html = fmtTxt(exercise.textWithBlanks || "");
    (exercise.blanks || []).forEach((blank) => {
      const opciones = opcionesPorBlank[blank.id]
        .map((op) => `<option value="${escAttr(op)}" ${seleccionadas[blank.id] === op ? "selected" : ""}>${escHTML(op)}</option>`)
        .join("");
      const select = `<select class="dropdown-select" data-blank="${escAttr(blank.id)}">
        <option value="" ${!seleccionadas[blank.id] ? "selected" : ""}>—</option>
        ${opciones}
      </select>`;
      html = html.replace(`{{${blank.id}}}`, select);
    });
    return html;
  };

  const pintar = () => {
    const todasLlenas = (exercise.blanks || []).every((b) => !!seleccionadas[b.id]);
    dyn.innerHTML = `
      ${exercise.prompt ? `<div class="dropdown-instruccion">${fmtTxt(exercise.prompt)}</div>` : ""}
      <div class="pregunta-prompt dropdown-texto">${construirTexto()}</div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar" ${todasLlenas ? "" : "disabled"}>✅ Comprobar</button>
      </div>
    `;

    dyn.querySelectorAll(".dropdown-select").forEach((sel) => {
      sel.addEventListener("change", () => {
        seleccionadas[sel.dataset.blank] = sel.value;
        pintar();
      });
    });
    dyn.querySelector("#btnComprobar")?.addEventListener("click", () => {
      if (todasLlenas) {
        onListo((exercise.blanks || []).map((b) => ({ id: b.id, selected: seleccionadas[b.id] })));
      }
    });
  };

  pintar();
}

function calificarDropdown(exercise, respuesta) {
  const dado = new Map((respuesta || []).map((b) => [b.id, b.selected]));
  for (const blank of exercise.blanks || []) {
    if (dado.get(blank.id) !== blank.correctOption) return { correcto: false };
  }
  return { correcto: true };
}


// tipos-ejercicio/code-fill.js
//
// "Completa el código": un bloque de código real (resaltado, con números de
// línea) donde los {{huecos}} son listas desplegables dentro del propio
// código. Mide justo lo que pide AI-901 en el dominio de implementación:
// leer y completar fragmentos del SDK, no memorizar definiciones.
//
// Datos:
//   { type: "code-fill", prompt, code: { lang, title, source, highlight },
//     blanks: [{ id, options: [...], correctOption }], explanation }

function renderCodeFill(exercise, container, onListo) {
  const blanks = exercise.blanks || [];
  const seleccion = {};
  const opciones = {};
  blanks.forEach((b) => { opciones[b.id] = opcionesBarajadas(b.options, exercise); });

  const selects = {};
  blanks.forEach((b) => {
    selects[b.id] = `<select class="cf-select" data-blank="${escAttr(b.id)}" aria-label="Hueco ${escAttr(b.id)}">
      <option value="">▢ elige…</option>
      ${opciones[b.id].map((op) => `<option value="${escAttr(op)}">${escHTML(op)}</option>`).join("")}
    </select>`;
  });

  container.innerHTML = `
    ${renderImagenDeEjercicio(exercise)}
    <div class="pregunta-prompt">${fmtTxt(exercise.prompt)}</div>
    ${renderBloqueCodigo({ lang: exercise.code?.lang, title: exercise.code?.title, source: exercise.code?.source, highlight: exercise.code?.highlight, blanks: selects })}
    <p class="ajustes-nota cf-nota">Elige la opción correcta en cada hueco del código (${blanks.length}).</p>
    <div class="ejercicio-acciones">
      <button type="button" class="btn btn-solido" id="btnComprobar" disabled>✅ Comprobar</button>
    </div>
  `;

  const btn = container.querySelector("#btnComprobar");
  const refrescar = () => {
    btn.disabled = !blanks.every((b) => !!seleccion[b.id]);
  };
  container.querySelectorAll(".cf-select").forEach((sel) => {
    sel.addEventListener("change", () => {
      seleccion[sel.dataset.blank] = sel.value;
      sel.classList.toggle("lleno", !!sel.value);
      refrescar();
    });
  });
  btn.addEventListener("click", () => {
    if (!btn.disabled) onListo(blanks.map((b) => ({ id: b.id, selected: seleccion[b.id] })));
  });
}

// Se califica igual que el desplegable de texto: todos los huecos correctos.
function calificarCodeFill(exercise, respuesta) {
  return calificarDropdown(exercise, respuesta);
}

// Para el modal de feedback / el reporte: el código ya resuelto.
function renderSolucionCodeFill(exercise, respuestaUsuario) {
  const dado = new Map((respuestaUsuario || []).map((b) => [b.id, b.selected]));
  const blanks = {};
  (exercise.blanks || []).forEach((b) => {
    const acierto = dado.size ? dado.get(b.id) === b.correctOption : true;
    blanks[b.id] = acierto
      ? `<mark class="cf-res ok">${escHTML(b.correctOption)}</mark>`
      : `<mark class="cf-res mal">${escHTML(dado.get(b.id) || "—")}</mark><mark class="cf-res ok">${escHTML(b.correctOption)}</mark>`;
  });
  return renderBloqueCodigo({ lang: exercise.code?.lang, title: exercise.code?.title, source: exercise.code?.source, highlight: exercise.code?.highlight, blanks, copiar: false });
}


// tipos-ejercicio/texto-libre.js
//
// Input de escritura libre, con dos modos:
//
//  - modo "recordar" (por defecto, para compatibilidad con datos ya
//    existentes): se califica comparando contra `respuestasAceptadas`, de
//    forma flexible (sin importar mayúsculas, tildes ni espacios extra).
//    El prompt puede ir en cualquier dirección: dar el término y pedir su
//    significado, o dar el significado/definición y pedir el término/sigla.
//
//  - modo "reflexion": NO tiene respuesta correcta. Es para preguntas
//    abiertas de análisis ("¿cuál usarías para X y por qué?"). Lo que se
//    escribe se guarda tal cual (ver motor/conceptos.js) para poder
//    revisarlo después — no cuenta para el nivel del concepto, igual que
//    los ejercicios de la sección de Aprendizaje no cuentan para la nota.

function renderTextoLibre(exercise, container, onListo) {
  const esReflexion = exercise.modo === "reflexion";
  const pintar = (valor) => {
    container.innerHTML = `
      ${renderImagenDeEjercicio(exercise)}
      <div class="pregunta-prompt">${fmtTxt(exercise.prompt)}</div>
      ${renderCodigoDeEjercicio(exercise)}
      <div class="texto-libre-area">
        <input type="text" class="texto-libre-input" placeholder="${esReflexion ? "Escribe tu respuesta o reflexión…" : "Escribe tu respuesta…"}"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               value="${escHTML(valor || "")}">
      </div>
      <div class="ejercicio-acciones">
        <button type="button" class="btn btn-solido" id="btnComprobar" ${(valor || "").trim() ? "" : "disabled"}>
          ${esReflexion ? "💭 Guardar" : "✅ Comprobar"}
        </button>
      </div>
    `;
    const input = container.querySelector(".texto-libre-input");
    input.addEventListener("input", () => {
      container.querySelector("#btnComprobar").disabled = !input.value.trim();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && input.value.trim()) container.querySelector("#btnComprobar").click();
    });
    container.querySelector("#btnComprobar").addEventListener("click", () => {
      if (input.value.trim()) onListo(input.value.trim());
    });
    input.focus();
  };
  pintar("");
}

function calificarTextoLibre(exercise, respuesta) {
  if (exercise.modo === "reflexion") {
    // No hay respuesta correcta: se marca "correcto" para no afectar el
    // nivel del concepto, y se señala esReflexion para que el motor de
    // conceptos guarde el texto en vez de comparalo contra nada.
    return { correcto: true, esReflexion: true };
  }
  const dado = normalizarTextoLibre(respuesta);
  const aceptadas = exercise.respuestasAceptadas || [];
  const correcto = aceptadas.some((a) => normalizarTextoLibre(a) === dado);
  return { correcto };
}

// minúsculas + sin tildes + espacios colapsados y recortados
function normalizarTextoLibre(str) {
  return String(str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}

      history.back(); // vuelve a Lecciones sin apilar una entrada nueva
    } else if (r.terminoLeccion) {
      toast("✅ Lección completada");
      history.back();
    } else {
      mostrarSiguienteEjercicio(seccionId);
    }
  }

  // ---------------- Aprendizaje (teoría + logros + práctica no calificable) ----------------

  function abrirAprendizaje() {
    const seccionId = AppState.seccionActivaId;
    if (!seccionId) return;
    renderAprendizaje(seccionId, callbacksAprendizaje);
    mostrarPantalla("aprendizaje");
  }

  function iniciarPracticaUI(seccionId) {
    asegurarPracticaActual(seccionId);
    mostrarPantalla("ejercicio");
    mostrarSiguientePractica(seccionId);
  }

  function mostrarSiguientePractica(seccionId) {
    const actual = obtenerItemPractica(seccionId);
    const tagEl = document.getElementById("ejercicioTag");
    const cont = document.getElementById("ejercicioContainer");
    ocultarDefinicion();
    if (!actual) {
      toast("🎉 Terminaste la práctica de esta sección");
      history.back(); // el popstate reconstruye Aprendizaje (ver init())
      return;
    }
    if (tagEl) tagEl.textContent = "💡 Práctica · " + seccionId;
    renderEjercicio(actual.exercise, cont, (respuesta) => manejarRespuestaPractica(seccionId, respuesta));
  }

  function manejarRespuestaPractica(seccionId, respuesta) {
    const pendiente = procesarRespuestaPractica(seccionId, respuesta);
    if (!pendiente) return;
    mostrarModalFeedback({
      exercise: pendiente.exercise,
      correcto: pendiente.correcto,
      respuestaUsuario: respuesta,
      onContinuar: () => { avanzarPunteroPractica(seccionId); mostrarSiguientePractica(seccionId); },
      onRepasar: () => { repasarItemPractica(seccionId); mostrarSiguientePractica(seccionId); },
    });
  }

  // ---------------- Conceptos (glosario con repetición espaciada) ----------------

  function abrirMapaServicios() {
    renderMapaServicios();
    mostrarPantalla("mapaServicios");
  }

  function abrirSimulacroUI() {
    abrirSimulacroDesdeTab();
    mostrarPantalla("simulacro");
  }

  async function abrirConceptos() {
    await asegurarCatalogoConceptos();
    renderConceptos(callbacksConceptos);
    mostrarPantalla("conceptos");
  }

  function abrirConcepto(conceptoId) {
    AppState.conceptoActivoId = conceptoId;
    iniciarRepasoConcepto(conceptoId);
    mostrarPantalla("ejercicio");
    mostrarSiguienteItemConcepto();
  }

  function ocultarDefinicion() {
    const def = document.getElementById("ejercicioDefinicion");
    if (def) { def.style.display = "none"; def.textContent = ""; }
  }

  function mostrarSiguienteItemConcepto() {
    const conceptoId = AppState.conceptoActivoId;
    const actual = obtenerItemRepasoConcepto(conceptoId);
    const tagEl = document.getElementById("ejercicioTag");
    const cont = document.getElementById("ejercicioContainer");
    if (!actual) {
      ocultarDefinicion();
      history.back(); // el popstate reconstruye Conceptos (ver init())
      return;
    }
    const concepto = (AppState.conceptosCatalogo || []).find((c) => c.id === conceptoId);
    if (tagEl) tagEl.textContent = "📚 " + (concepto ? concepto.termino : conceptoId) + (actual.esRepaso ? " · repaso" : "");

    // La definición se muestra SOLO en el primer ejercicio de la PRIMERA
    // vez que se estudia este concepto (historial vacío) — en repasos
    // posteriores se va directo a las preguntas.
    const esPrimeraVezDelConcepto = getConceptoState(conceptoId).historial.length === 0 && actual.posicion === 0 && !actual.esRepaso;
    const defEl = document.getElementById("ejercicioDefinicion");
    if (defEl) {
      if (esPrimeraVezDelConcepto && concepto?.definicion) {
        defEl.style.display = "block";
        defEl.innerHTML = "💡 <strong>" + (concepto.nombreCompleto || concepto.termino) + ":</strong> " + concepto.definicion;
      } else {
        defEl.style.display = "none";
        defEl.textContent = "";
      }
    }

    renderEjercicio(actual.exercise, cont, (respuesta) => manejarRespuestaConcepto(respuesta));
  }

  function manejarRespuestaConcepto(respuesta) {
    const conceptoId = AppState.conceptoActivoId;
    const pendiente = procesarRespuestaConcepto(conceptoId, respuesta);
    if (!pendiente) return;
    mostrarModalFeedback({
      exercise: pendiente.exercise,
      correcto: pendiente.correcto,
      esReflexion: pendiente.esReflexion,
      respuestaUsuario: respuesta,
      onContinuar: () => manejarAvanceConcepto(confirmarContinuarConcepto(conceptoId, pendiente)),
      onRepasar: () => manejarAvanceConcepto(confirmarRepasarConcepto(conceptoId, pendiente)),
    });
  }

  function manejarAvanceConcepto(r) {
    if (r.cierre) {
      toast("📈 Nivel " + r.cierre.nivel + "/10 — " + r.cierre.aciertos + "/" + r.cierre.total + " correctas");
      history.back(); // vuelve a Conceptos sin apilar una entrada nueva
    } else {
      mostrarSiguienteItemConcepto();
    }
  }

  async function init() {
    cargarDeStorage();
    refrescarSecciones();

    document.getElementById("btnAjustes").addEventListener("click", () => {
      mostrarModalAjustes({ onCambios: refrescarSecciones });
    });

    // Los botones ← simplemente le piden al navegador que retroceda en su
    // historial — y es el listener de "popstate" de más abajo el que
    // reconstruye la pantalla de destino. Así el botón en pantalla y el
    // gesto/botón físico de "atrás" del teléfono quedan sincronizados: es
    // literalmente el mismo camino de código.
    document.getElementById("btnVolverSecciones").addEventListener("click", () => history.back());
    document.getElementById("btnVolverLecciones").addEventListener("click", () => history.back());
    document.getElementById("btnVolverDeAprendizaje").addEventListener("click", () => history.back());
    document.getElementById("btnVolverMapaServicios").addEventListener("click", () => history.back());

    document.getElementById("btnAbrirAprendizaje").addEventListener("click", abrirAprendizaje);
    document.getElementById("btnCopiarReporteSeccion").addEventListener("click", () => {
      copiarReporteSeccion(AppState.seccionActivaId);
    });

    document.querySelectorAll(".tabbar-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.tab === "secciones") { refrescarSecciones(); mostrarPantalla("secciones"); }
        else if (btn.dataset.tab === "conceptos") { abrirConceptos(); }
        else if (btn.dataset.tab === "simulacro") { abrirSimulacroUI(); }
      });
    });

    // Punto de partida del historial de navegación (ver mostrarPantalla).
    history.replaceState({ pantalla: "secciones" }, "", "#secciones");
    window.addEventListener("popstate", (evento) => {
      const destino = (evento.state && evento.state.pantalla) || "secciones";
      // Reconstruye el contenido de la pantalla destino, igual que hacía
      // cada botón de "volver" antes — solo que ahora responde tanto al
      // botón en pantalla como al gesto/botón nativo del teléfono.
      if (destino === "secciones") refrescarSecciones();
      else if (destino === "lecciones") renderLecciones(AppState.seccionActivaId, callbacksLecciones);
      else if (destino === "aprendizaje") renderAprendizaje(AppState.seccionActivaId, callbacksAprendizaje);
      else if (destino === "conceptos") renderConceptos(callbacksConceptos);
      else if (destino === "simulacro") abrirSimulacroDesdeTab();
      else if (destino === "mapaServicios") renderMapaServicios();
      mostrarPantalla(destino, { push: false });
    });

    // Si entregué ejercicios nuevos (DATA_VERSION distinta), vuelve a leer todos
    // los bancos y limpia el progreso de lo que ya no existe. Si es la misma
    // versión no hace nada. Después precarga las secciones para que el mapa
    // muestre de una vez cuáles están "(Vacío)" y cuáles no.
    const sincronizado = await sincronizarBancos();
    await Promise.all(SECCIONES.map((s) => asegurarDatosSeccion(s.id)));
    refrescarSecciones();
    await asegurarCatalogoConceptos();
    if (sincronizado) toast("📦 Banco de ejercicios actualizado");
  }

  init();

</script>
</body>
</html>
