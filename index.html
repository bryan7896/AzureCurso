// ------------------------------------------------------------
// Persistencia
// ------------------------------------------------------------

export function guardar() {
  try {
    const data = {
      secciones: AppState.secciones,
      conceptos: AppState.conceptos,
      reflexiones: AppState.reflexiones,
      simulacros: AppState.simulacros,
      datosVersion: AppState.datosVersion,
      lastUpdated: new Date().toISOString(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("No se pudo guardar el progreso:", e);
  }
}

let _saveTimer = null;
export function guardarConDebounce() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(guardar, 400);
}

export function cargarDeStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    AppState.secciones = data.secciones || {};
    AppState.conceptos = data.conceptos || {};
    AppState.reflexiones = data.reflexiones || [];
    AppState.simulacros = { ...simulacrosVacio(), ...(data.simulacros || {}) };
    AppState.datosVersion = data.datosVersion || null;
    Object.keys(AppState.secciones).forEach((id) => migrarProgresoSeccion(AppState.secciones[id]));
    return true;
  } catch (e) {
    console.warn("No se pudo leer el progreso guardado:", e);
    return false;
  }
}

// Consulta datos/conceptos.json una sola vez (igual que asegurarDatosSeccion).
export async function asegurarCatalogoConceptos({ forzar = false } = {}) {
  if (AppState.conceptosCatalogo && !forzar) return AppState.conceptosCatalogo;
  try {
    const resp = await fetch("datos/conceptos.json", { cache: "no-store" });
    const data = resp.ok ? await resp.json() : null;
    AppState.conceptosCatalogo = (data && data.conceptos) || [];
  } catch (e) {
    console.warn("No se pudo cargar datos/conceptos.json:", e);
    AppState.conceptosCatalogo = AppState.conceptosCatalogo || [];
  }
  return AppState.conceptosCatalogo;
}

// ------------------------------------------------------------
// Carga de datos (fetch on demand, solo la primera vez por sección)
// ------------------------------------------------------------

/**
 * Asegura que una sección tenga sus datos cargados en memoria.
 * Si ya estaba cargada (this session o restaurada de localStorage) y no
 * se fuerza, NO vuelve a consultar el .json — así se respeta la regla:
 * "si tiene data no consulta nuevamente el json, si no tiene data, sí".
 */
export async function asegurarDatosSeccion(seccionId, { forzar = false } = {}) {
  const estado = getSeccionState(seccionId);
  if (estado.cargada && !forzar) return estado;

  try {
    const [infoResp, ejResp] = await Promise.all([
      fetch(rutaInformacion(seccionId), { cache: "no-store" }),
      fetch(rutaEjercicios(seccionId), { cache: "no-store" }),
    ]);
    const info = infoResp.ok ? await infoResp.json() : null;
    const ejData = ejResp.ok ? await ejResp.json() : null;
    const nuevos = (ejData && ejData.exercises) || [];

    estado.ejercicios = forzar && estado.ejercicios.length
      ? mergeEjercicios(estado.ejercicios, nuevos)
      : nuevos;
    estado.info = info;
    estado.cargada = true;
    estado.errorCarga = false;
  } catch (e) {
    console.warn(`No se pudo cargar la sección ${seccionId}:`, e);
    estado.cargada = true; // evita reintentos infinitos automáticos en cada render
    estado.errorCarga = true;
  }
  guardarConDebounce();
  return estado;
}

// Suma ejercicios nuevos (por id) sin perder errorBank/intentos de los que
// ya existían — usado por "🔍 Analizar" en Ajustes cuando vas rellenando
// los .json poco a poco.
function mergeEjercicios(actuales, nuevos) {
  const idsActuales = new Set(actuales.map((e) => e.id));
  const agregados = nuevos.filter((e) => !idsActuales.has(e.id));
  return [...actuales, ...agregados];
}

// Progresos guardados con versiones anteriores de la app: les agrega los
// campos nuevos sin perder nada. (Si ya había un último resultado por
// ejercicio de un intento viejo, se usa como punto de partida del acumulado.)
function migrarProgresoSeccion(seccion) {
  if (!seccion || !seccion.progreso) return;
  const p = seccion.progreso;
  if (!p.resultadoPorEjercicio) p.resultadoPorEjercicio = { ...(p.ultimoResultadoDetalle || {}) };
}

// Quita del progreso todo lo que apunte a ejercicios que ya no existen en el
// banco, o cuyo CONTENIDO cambió aunque conserven el id (un resultado viejo no
// vale para una pregunta distinta). `previos` = Map id -> JSON del ejercicio
// que había antes. Si el intento en curso usaba alguno de esos ejercicios, se
// descarta para que se regenere con el banco nuevo.
function sanearProgreso(seccionId, previos) {
  const estado = getSeccionState(seccionId);
  const vigentes = new Set(
    estado.ejercicios.filter((e) => !previos || !previos.has(e.id) || previos.get(e.id) === JSON.stringify(e)).map((e) => e.id)
  );
  const p = estado.progreso;
  ["errorBank", "resultadoPorEjercicio", "ultimoResultadoDetalle"].forEach((campo) => {
    Object.keys(p[campo] || {}).forEach((id) => { if (!vigentes.has(id)) delete p[campo][id]; });
  });
  if (p.intentoActual) {
    const usaObsoleto = p.intentoActual.lecciones.some((l) => l.cola.some((it) => !vigentes.has(it.exerciseId)));
    if (usaObsoleto) {
      p.intentoActual = null;
      p.historialIntentoActual = [];
      p.leccionesCompletadas = 0;
      if (p.estado === "en-progreso") p.estado = "no-iniciado";
    }
  }
}

// Lee un banco SIN tocar el estado (para poder abortar sin dejar nada a medias).
async function leerBancoSeccion(seccionId) {
  const [infoResp, ejResp] = await Promise.all([
    fetch(rutaInformacion(seccionId), { cache: "no-store" }),
    fetch(rutaEjercicios(seccionId), { cache: "no-store" }),
  ]);
  if (!ejResp.ok) throw new Error("no se pudo leer " + rutaEjercicios(seccionId));
  const ejData = await ejResp.json();
  return { info: infoResp.ok ? await infoResp.json() : null, ejercicios: (ejData && ejData.exercises) || [] };
}

/**
 * Si cambió DATA_VERSION (porque entregué ejercicios nuevos), vuelve a leer
 * TODOS los bancos reemplazando lo guardado y limpia el progreso obsoleto.
 * Es TODO O NADA: primero lee todo; si cualquier archivo falla (sin conexión,
 * archivo faltante) no se modifica nada y se reintenta en el próximo arranque.
 * Devuelve true si hizo la sincronización.
 */
export async function sincronizarBancos() {
  if (AppState.datosVersion === DATA_VERSION) return false;

  const nuevos = {};
  let catalogo;
  try {
    for (const s of SECCIONES) nuevos[s.id] = await leerBancoSeccion(s.id);
    const resp = await fetch("datos/conceptos.json", { cache: "no-store" });
    if (!resp.ok) throw new Error("no se pudo leer datos/conceptos.json");
    catalogo = ((await resp.json()) || {}).conceptos || [];
  } catch (e) {
    console.warn("Sincronización de bancos pospuesta:", e);
    return false;
  }

  SECCIONES.forEach((s) => {
    const estado = getSeccionState(s.id);
    const previos = new Map(estado.ejercicios.map((e) => [e.id, JSON.stringify(e)]));
    estado.ejercicios = nuevos[s.id].ejercicios;
    estado.info = nuevos[s.id].info;
    estado.cargada = true;
    estado.errorCarga = false;
    sanearProgreso(s.id, previos);
  });

  AppState.conceptosCatalogo = catalogo;
  const idsConceptos = new Set(catalogo.map((c) => c.id));
  Object.keys(AppState.conceptos).forEach((id) => { if (!idsConceptos.has(id)) delete AppState.conceptos[id]; });
  AppState.datosVersion = DATA_VERSION;
  guardar();
  return true;
}

/** Re-consulta TODOS los .json de datos/, sin importar si ya estaban cargados. */
export async function analizarTodo() {
  const resultados = [];
  for (const s of SECCIONES) {
    const antes = getSeccionState(s.id).ejercicios.length;
    const estado = await asegurarDatosSeccion(s.id, { forzar: true });
    resultados.push({ id: s.id, titulo: s.titulo, total: estado.ejercicios.length, nuevos: estado.ejercicios.length - antes });
  }
  guardar();
  return resultados;
}

// ------------------------------------------------------------
// Utilidades
// ------------------------------------------------------------

function barajar(arr) {
  const copia = [...arr];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

// Cada lección es una "cola" única de posiciones (no dos arrays separados):
// así [Repasar] simplemente EMPUJA una copia excluida al final de la misma
// cola, y el puntero (indiceActual) avanza en línea recta hasta agotarla
// — sin importar cuánto haya crecido mientras tanto.
function crearLeccionesDesdeIds(ids) {
  const lecciones = [];
  for (let i = 0; i < ids.length; i += TAMANO_MAX_LECCION) {
    const grupo = ids.slice(i, i + TAMANO_MAX_LECCION);
    lecciones.push({
      cola: grupo.map((id) => ({ exerciseId: id, excluido: false })),
      indiceActual: 0,
      completada: false,
      resultados: {}, // posicion (índice en cola) -> { exerciseId, correcto, excluido }
    });
  }
  return lecciones;
}

// ------------------------------------------------------------
// Intento actual de una sección (1er intento y reintento)
// ------------------------------------------------------------

export function obtenerIntentoActual(seccionId) {
  const estado = getSeccionState(seccionId);
  if (!estado.progreso.intentoActual) {
    const ids = barajar(estado.ejercicios.map((e) => e.id));
    estado.progreso.intentoActual = {
      numero: estado.progreso.intentos.length + 1,
      esReintento: false,
      generadoEn: new Date().toISOString(),
      lecciones: crearLeccionesDesdeIds(ids),
    };
    estado.progreso.historialIntentoActual = [];
    estado.progreso.estado = "en-progreso";
    guardarConDebounce();
  }
  return estado.progreso.intentoActual;
}

// Arma la tanda de reintento: 100% de los fallados + 30% de refuerzo,
// ponderado hacia los subtemas donde más se falló (ver muestraPonderada).
export function generarReintento(seccionId) {
  const estado = getSeccionState(seccionId);
  const detalle = estado.progreso.resultadoPorEjercicio || {};
  const ids = construirIdsReintento(estado.ejercicios, detalle);

  estado.progreso.intentoActual = {
    numero: estado.progreso.intentos.length + 1,
    esReintento: true,
    generadoEn: new Date().toISOString(),
    lecciones: crearLeccionesDesdeIds(ids),
  };
  estado.progreso.historialIntentoActual = [];
  estado.progreso.estado = "en-progreso";
  guardarConDebounce();
  return estado.progreso.intentoActual;
}

function construirIdsReintento(todosEjercicios, resultadosFinales) {
  const porId = new Map(todosEjercicios.map((e) => [e.id, e]));
  // 100% de los fallados + los que nunca llegaron a calificarse (p. ej. los
  // que mandaste a [Repasar]) — sin estos la sección nunca podría cerrarse.
  const falladosIds = todosEjercicios
    .map((e) => e.id)
    .filter((id) => resultadosFinales[id] === false || resultadosFinales[id] === undefined);
  const aprobadosIds = todosEjercicios.map((e) => e.id).filter((id) => resultadosFinales[id] === true);

  const fallosPorSubtema = {};
  falladosIds.forEach((id) => {
    const sub = porId.get(id)?.subtopic || porId.get(id)?.topic || "_general";
    fallosPorSubtema[sub] = (fallosPorSubtema[sub] || 0) + 1;
  });

  const cantidadRefuerzo = Math.round(aprobadosIds.length * RETRY_REFUERZO_RATIO);
  const refuerzo = muestraPonderadaPorSubtema(aprobadosIds, porId, fallosPorSubtema, cantidadRefuerzo);

  return barajar([...falladosIds, ...refuerzo]);
}

// Elige `cantidad` ids de `passedIds` sin reemplazo, dando más probabilidad
// a los que pertenecen a un subtema con más fallos (así el 30% de refuerzo
// se concentra en lo que más te costó, en vez de ser puramente al azar).
function muestraPonderadaPorSubtema(passedIds, porId, fallosPorSubtema, cantidad) {
  if (cantidad <= 0 || passedIds.length === 0) return [];
  const pool = passedIds.map((id) => {
    const sub = porId.get(id)?.subtopic || porId.get(id)?.topic || "_general";
    const prioridad = porId.get(id)?.peso || PESO_EJERCICIO_DEFECTO;
    return { id, peso: ((fallosPorSubtema[sub] || 0) + 1) * prioridad };
  });
  const elegidos = [];
  const disponibles = [...pool];
  for (let i = 0; i < cantidad && disponibles.length; i++) {
    const total = disponibles.reduce((s, x) => s + x.peso, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < disponibles.length - 1; idx++) {
      r -= disponibles[idx].peso;
      if (r <= 0) break;
    }
    elegidos.push(disponibles[idx].id);
    disponibles.splice(idx, 1);
  }
  return elegidos;
}

// ------------------------------------------------------------
// Reset / exportar / importar
// ------------------------------------------------------------

export function reiniciarProgresoSeccion(seccionId) {
  const estado = getSeccionState(seccionId);
  const { ejercicios, info } = estado;
  AppState.secciones[seccionId] = { ...seccionVacia(), cargada: true, ejercicios, info };
  guardar();
}

export function reiniciarTodoElProgreso() {
  Object.keys(AppState.secciones).forEach((id) => reiniciarProgresoSeccion(id));
  Object.keys(AppState.conceptos).forEach((id) => { AppState.conceptos[id] = conceptoVacio(); });
  AppState.reflexiones = [];
  AppState.simulacros = simulacrosVacio();
  guardar();
}

export function exportarProgreso() {
  return JSON.stringify({ secciones: AppState.secciones, conceptos: AppState.conceptos, reflexiones: AppState.reflexiones, simulacros: AppState.simulacros, datosVersion: AppState.datosVersion, exportadoEn: new Date().toISOString() }, null, 2);
}

export function importarProgreso(jsonText) {
  const data = JSON.parse(jsonText);
  if (!data || !data.secciones) throw new Error("El archivo no tiene el formato esperado.");
  AppState.secciones = data.secciones;
  AppState.conceptos = data.conceptos || {};
  AppState.reflexiones = data.reflexiones || [];
  AppState.simulacros = { ...simulacrosVacio(), ...(data.simulacros || {}) };
  AppState.datosVersion = data.datosVersion || null; // si es de una versión vieja, sincronizarBancos() lo normaliza al abrir
  Object.keys(AppState.secciones).forEach((id) => migrarProgresoSeccion(AppState.secciones[id]));
  guardar();
}


// motor/ejercicio-ui.js
//
// Piezas visuales compartidas por todos los tipos de ejercicio: iconos de
// Azure (inyectados por build.py en la constante ICONOS), la imagen que puede
// acompañar a un enunciado y el "esqueleto" estático (imagen + enunciado +
// código) que no debe repintarse cada vez que el usuario toca una opción.

function iconoDe(id) {
  return typeof ICONOS !== "undefined" && ICONOS[id] ? ICONOS[id] : null;
}

function nombreIcono(id) {
  const ic = iconoDe(id);
  return ic ? ic.n : id;
}

// tam: "sm" (opciones) | "md" | "lg" | "xl" (imagen del enunciado)
// conNombre=false => alt vacío: el icono es la pregunta y su nombre no debe filtrarse.
function iconoHTML(id, { tam = "md", conNombre = true } = {}) {
  const ic = iconoDe(id);
  if (!ic) return "";
  const alt = conNombre ? ` alt="${escAttr(ic.n)}"` : ` alt="" aria-hidden="true"`;
  return `<span class="icono-tile icono-${tam}"><img src="${ic.src}"${alt} draggable="false"></span>`;
}

function renderImagenDeEjercicio(exercise) {
  if (!exercise?.imagen) return "";
  return `<div class="ej-imagen">${iconoHTML(exercise.imagen, { tam: "xl", conNombre: false })}</div>`;
}

// Escribe la parte estática del ejercicio y devuelve el <div> dinámico donde
// cada renderizador pinta sus opciones/botones.
function prepararContenedor(container, exercise, { promptHtml } = {}) {
  const prompt = promptHtml !== undefined ? promptHtml : `<div class="pregunta-prompt">${fmtTxt(exercise.prompt)}</div>`;
  container.innerHTML = `${renderImagenDeEjercicio(exercise)}${prompt}${renderCodigoDeEjercicio(exercise)}<div class="ej-dinamico"></div>`;
  const dyn = container.querySelector(".ej-dinamico");
  // La animación de entrada de las opciones solo debe verse al abrir el
  // ejercicio: en cuanto el usuario toca algo y se repinta, ya no se repite
  // (antes todas las opciones parpadeaban desde invisible en cada toque).
  dyn.addEventListener("click", () => dyn.classList.add("ya-pintado"), true);
  return dyn;
}

// Orden aleatorio de opciones salvo que el ejercicio pida `noBarajar` (p. ej.
// "Todas las anteriores"). Se llama UNA vez por render, no en cada repintado.
function opcionesBarajadas(lista, exercise) {
  const base = [...(lista || [])];
  return exercise && exercise.noBarajar ? base : barajar(base);
}


// motor/codigo.js
//
// Bloques de código "bonitos" para los ejercicios: resaltado de sintaxis
// propio (sin librerías ni CDN, la app es 100% offline), números de línea,
// barra de título estilo editor, líneas destacadas y botón de copiar.
//
// Lenguajes: python, json, bash (az / pip / curl), xml (SSML), text.
//
// Convenciones de los datos:
//   code: { lang: "python", title: "chat_client.py", source: "...", highlight: [3,4] }
//   En un `code-fill`, los huecos van como {{id}} dentro de `source`.
//   Texto con `código inline` entre acentos graves → <code> (ver fmtTxt).

// ---------------------------------------------------------------------------
// Texto con `código inline`
// ---------------------------------------------------------------------------

// Escapa HTML y convierte `x` en <code class="cod-inline">x</code>.
function fmtTxt(str) {
  const seguro = escHTML(str);
  return seguro.replace(/`([^`\n]+)`/g, '<code class="cod-inline">$1</code>');
}

function escAttr(str) {
  return escHTML(str).replace(/"/g, "&quot;");
}

// ---------------------------------------------------------------------------
// Tokenizadores — devuelven [{ t: "tipo", x: "texto" }]
// ---------------------------------------------------------------------------

const PY_KW = new Set([
  "and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else",
  "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "nonlocal", "not",
  "or", "pass", "raise", "return", "try", "while", "with", "yield",
]);
const PY_CONST = new Set(["True", "False", "None"]);
const PY_BUILTIN = new Set([
  "print", "len", "range", "str", "int", "float", "bool", "list", "dict", "set", "tuple", "open", "input",
  "isinstance", "enumerate", "zip", "map", "filter", "sorted", "sum", "min", "max", "abs", "type", "super",
  "Exception", "ValueError", "KeyError", "RuntimeError", "self", "cls", "__name__",
]);

function tokenizarPython(src) {
  const out = [];
  let i = 0;
  let depth = 0;
  let prevSig = ""; // último token no-espacio (texto)
  let primeroDeLinea = ""; // primer token significativo de la línea actual: "from" | "import" | ""
  let viendoImport = false; // ya pasamos el "import" de la línea
  const n = src.length;

  const push = (t, x) => {
    out.push({ t, x });
    if (t !== "ws" && t !== "cm") prevSig = x; // un comentario no cuenta como "token anterior"
  };
  const siguienteCaracter = (desde) => {
    let j = desde;
    while (j < n && (src[j] === " " || src[j] === "\t")) j++;
    return { c: src[j] || "", j };
  };

  while (i < n) {
    const ch = src[i];

    if (ch === "\n") {
      push("ws", "\n");
      i++;
      primeroDeLinea = "";
      viendoImport = false;
      continue;
    }
    if (ch === " " || ch === "\t" || ch === "\r") {
      let j = i;
      while (j < n && (src[j] === " " || src[j] === "\t" || src[j] === "\r")) j++;
      out.push({ t: "ws", x: src.slice(i, j) });
      i = j;
      continue;
    }
    if (ch === "#") {
      let j = i;
      while (j < n && src[j] !== "\n") j++;
      push("cm", src.slice(i, j));
      i = j;
      continue;
    }

    // strings (con prefijos r, b, u, f y comillas triples)
    const mStr = /^([rRbBuUfF]{1,2})?("""|'''|"|')/.exec(src.slice(i, i + 5));
    if (mStr) {
      const prefijo = mStr[1] || "";
      const comilla = mStr[2];
      const esF = /[fF]/.test(prefijo);
      let j = i + prefijo.length + comilla.length;
      let fin = -1;
      while (j < n) {
        if (src[j] === "\\") { j += 2; continue; }
        if (src.startsWith(comilla, j)) { fin = j + comilla.length; break; }
        if (comilla.length === 1 && src[j] === "\n") { fin = j; break; }
        j++;
      }
      if (fin === -1) fin = n;
      const cuerpo = src.slice(i, fin);
      if (esF) {
        // separa {expresiones} dentro del f-string
        const partes = cuerpo.split(/(\{\{|\}\}|\{[^{}\n]*\})/);
        partes.forEach((p) => {
          if (!p) return;
          if (/^\{[^{}]/.test(p) || p === "{}") out.push({ t: "ip", x: p });
          else out.push({ t: "st", x: p });
        });
        prevSig = cuerpo;
      } else {
        push("st", cuerpo);
      }
      i = fin;
      continue;
    }

    // decorador
    if (ch === "@" && (prevSig === "" || out[out.length - 1]?.x?.endsWith("\n") || out[out.length - 1]?.t === "ws")) {
      const m = /^@[A-Za-z_][\w.]*/.exec(src.slice(i));
      if (m) { push("dc", m[0]); i += m[0].length; continue; }
    }

    // números
    if (/\d/.test(ch)) {
      const m = /^(?:0[xX][0-9a-fA-F_]+|\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?)/.exec(src.slice(i));
      push("nm", m[0]);
      i += m[0].length;
      continue;
    }

    // identificadores
    if (/[A-Za-z_]/.test(ch)) {
      const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i));
      const w = m[0];
      const sig = siguienteCaracter(i + w.length);
      const despues = src[sig.j + 1] || "";
      let t = "vr";

      if (PY_CONST.has(w)) t = "cn";
      else if (PY_KW.has(w)) {
        t = "kw";
        if (!primeroDeLinea) primeroDeLinea = w;
        if (w === "import") viendoImport = true;
      } else if (prevSig === "def") t = "fd";
      else if (prevSig === "class") t = "cl";
      else if (primeroDeLinea === "from" && !viendoImport) t = "md";
      else if (primeroDeLinea === "import" || (primeroDeLinea === "from" && viendoImport)) {
        t = /^[A-Z]/.test(w) && !/^[A-Z0-9_]+$/.test(w) ? "cl" : "md";
      } else if (prevSig === ".") {
        t = sig.c === "(" ? "fn" : "at";
      } else if (depth > 0 && (prevSig === "(" || prevSig === ",") && sig.c === "=" && despues !== "=") t = "pm";
      else if (PY_BUILTIN.has(w)) t = "bi";
      else if (sig.c === "(") t = /^[A-Z]/.test(w) ? "cl" : "fn";
      else if (/^[A-Z][A-Z0-9_]+$/.test(w)) t = "ev";
      else if (/^[A-Z]/.test(w)) t = "cl";
      push(t, w);
      i += w.length;
      continue;
    }

    // operadores y puntuación
    const mOp = /^(?:==|!=|<=|>=|->|\*\*|\/\/|:=|\+=|-=|\*=|\/=|[+\-*\/%=<>!&|^~])/.exec(src.slice(i, i + 2));
    if (mOp) { push("op", mOp[0]); i += mOp[0].length; continue; }
    if ("([{".includes(ch)) depth++;
    if (")]}".includes(ch)) depth = Math.max(0, depth - 1);
    push("pn", ch);
    i++;
  }
  return out;
}

function tokenizarJSON(src) {
  const out = [];
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],:])|(\s+)|(.)/g;
  let m;
  while ((m = re.exec(src))) {
    if (m[1] !== undefined) {
      if (m[2]) { out.push({ t: "jk", x: m[1] }); out.push({ t: "pn", x: m[2] }); }
      else out.push({ t: "st", x: m[1] });
    } else if (m[3] !== undefined) out.push({ t: "nm", x: m[3] });
    else if (m[4] !== undefined) out.push({ t: "cn", x: m[4] });
    else if (m[5] !== undefined) out.push({ t: "pn", x: m[5] });
    else if (m[6] !== undefined) out.push({ t: "ws", x: m[6] });
    else out.push({ t: "vr", x: m[7] });
  }
  return out;
}

function tokenizarBash(src) {
  const out = [];
  src.split("\n").forEach((linea, idx, arr) => {
    const re = /(#.*$)|("(?:\\.|[^"\\])*"|'[^']*')|(\$\{?[A-Za-z_][\w]*\}?)|(--?[A-Za-z][\w-]*)|(\\$)|(\s+)|([^\s"'$#\\]+)/g;
    let m;
    let palabra = 0;
    let primero = true;
    while ((m = re.exec(linea))) {
      if (m[1]) out.push({ t: "cm", x: m[1] });
      else if (m[2]) { out.push({ t: "st", x: m[2] }); palabra++; }
      else if (m[3]) { out.push({ t: "ev", x: m[3] }); palabra++; }
      else if (m[4]) out.push({ t: "pm", x: m[4] });
      else if (m[5]) out.push({ t: "pn", x: m[5] });
      else if (m[6]) out.push({ t: "ws", x: m[6] });
      else if (m[7]) {
        if (primero && m[7] === "$") { out.push({ t: "pn", x: m[7] }); continue; }
        if (palabra === 0) out.push({ t: "fn", x: m[7] });
        else if (palabra === 1) out.push({ t: "cl", x: m[7] });
        else out.push({ t: "vr", x: m[7] });
        palabra++;
        primero = false;
      }
    }
    if (idx < arr.length - 1) out.push({ t: "ws", x: "\n" });
  });
  return out;
}

function tokenizarXML(src) {
  const out = [];
  const re = /(<!--[\s\S]*?-->)|(<\/?)([A-Za-z_][\w:.-]*)|("[^"]*"|'[^']*')|([\w:.-]+)(?==)|(\/?>)|(=)|(\s+)|([^<>"'=\s]+)/g;
  let m;
  while ((m = re.exec(src))) {
    if (m[1]) out.push({ t: "cm", x: m[1] });
    else if (m[2]) { out.push({ t: "pn", x: m[2] }); out.push({ t: "tg", x: m[3] }); }
    else if (m[4]) out.push({ t: "st", x: m[4] });
    else if (m[5]) out.push({ t: "pm", x: m[5] });
    else if (m[6]) out.push({ t: "pn", x: m[6] });
    else if (m[7]) out.push({ t: "op", x: m[7] });
    else if (m[8]) out.push({ t: "ws", x: m[8] });
    else out.push({ t: "tx", x: m[9] });
  }
  return out;
}

function tokenizarCodigo(src, lang) {
  switch ((lang || "").toLowerCase()) {
    case "python":
    case "py":
      return tokenizarPython(src);
    case "json":
      return tokenizarJSON(src);
    case "bash":
    case "sh":
    case "shell":
    case "cli":
      return tokenizarBash(src);
    case "xml":
    case "ssml":
    case "html":
      return tokenizarXML(src);
    default:
      return [{ t: "vr", x: src }];
  }
}

const NOMBRE_LENGUAJE = { python: "Python", py: "Python", json: "JSON", bash: "Bash", sh: "Bash", shell: "Shell", cli: "CLI", xml: "XML", ssml: "SSML", html: "HTML", text: "Texto" };

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function tokensALineas(tokens) {
  const lineas = [[]];
  tokens.forEach((tk) => {
    tk.x.split("\n").forEach((parte, i) => {
      if (i > 0) lineas.push([]);
      if (parte !== "") lineas[lineas.length - 1].push({ t: tk.t, x: parte });
    });
  });
  return lineas;
}

// Resalta una sola línea (para ítems de "ordenar el código").
// Si la línea no cabe, solo se parte después de una coma o de un paréntesis
// de apertura (<wbr>), nunca a mitad de un identificador.
function resaltarLinea(src, lang) {
  return tokenizarCodigo(src, lang)
    .map((tk) => {
      if (tk.t === "ws") return escHTML(tk.x);
      const corte = (tk.t === "pn" && (tk.x === "," || tk.x === "(")) || (tk.t === "op" && tk.x === "=") ? "<wbr>" : "";
      return `<span class="tk-${tk.t}">${escHTML(tk.x)}</span>${corte}`;
    })
    .join("");
}

/**
 * Devuelve el HTML de un bloque de código completo.
 * @param {object} o  { lang, title, source, highlight:[n], blanks:{id: html}, copiar:bool, sinBarra:bool }
 *   - `blanks`: html con el que se reemplaza cada {{id}} (un <select>, o la respuesta correcta)
 */
function renderBloqueCodigo(o) {
  const lang = (o.lang || "text").toLowerCase();
  const fuente = String(o.source || "").replace(/\r\n/g, "\n").replace(/\n+$/, "");
  // los huecos se vuelven identificadores "inocuos" para que el tokenizador
  // los trate como una palabra; después se sustituyen por su HTML real.
  const conMarcas = fuente.replace(/\{\{(\w+)\}\}/g, "__BLK_$1__");
  const lineas = tokensALineas(tokenizarCodigo(conMarcas, lang));
  const resaltadas = new Set(o.highlight || []);
  const blanks = o.blanks || {};

  const filas = lineas
    .map((tokens, idx) => {
      let html = tokens
        .map((tk) => (tk.t === "ws" ? escHTML(tk.x) : `<span class="tk-${tk.t}">${escHTML(tk.x)}</span>`))
        .join("");
      html = html.replace(/__BLK_(\w+)__/g, (_, id) => (blanks[id] !== undefined ? blanks[id] : "▢"));
      return `<div class="cl${resaltadas.has(idx + 1) ? " hl" : ""}"><span class="cn">${idx + 1}</span><span class="cc">${html}</span></div>`;
    })
    .join("");

  const puedeCopiar = o.copiar !== false && !/\{\{\w+\}\}/.test(fuente);
  const barra = o.sinBarra
    ? ""
    : `<figcaption class="codigo-barra">
        <span class="codigo-dots"><i></i><i></i><i></i></span>
        <span class="codigo-titulo">${escHTML(o.title || "")}</span>
        <span class="codigo-lang">${escHTML(NOMBRE_LENGUAJE[lang] || lang)}</span>
        ${puedeCopiar ? `<button type="button" class="codigo-copiar" aria-label="Copiar código">Copiar</button>` : ""}
      </figcaption>`;

  return `<figure class="codigo${o.sinBarra ? " codigo-compacto" : ""}" data-lang="${escAttr(lang)}"${puedeCopiar ? ` data-raw="${escAttr(fuente)}"` : ""}>
    ${barra}
    <div class="codigo-cuerpo" tabindex="0">${filas}</div>
  </figure>`;
}

// Un solo listener para todos los botones "Copiar" de la app.
document.addEventListener("click", (e) => {
  const btn = e.target.closest?.(".codigo-copiar");
  if (!btn) return;
  const raw = btn.closest(".codigo")?.dataset.raw;
  if (raw == null) return;
  const listo = () => {
    btn.textContent = "¡Copiado!";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "Copiar"; btn.classList.remove("ok"); }, 1400);
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(raw).then(listo).catch(() => {});
  else {
    const ta = document.createElement("textarea");
    ta.value = raw; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); listo(); } catch (_) {}
    ta.remove();
  }
});

// Código que acompaña a un ejercicio cualquiera (campo `code`).
function renderCodigoDeEjercicio(exercise) {
  if (!exercise?.code) return "";
  return renderBloqueCodigo({ lang: exercise.code.lang, title: exercise.code.title, source: exercise.code.source, highlight: exercise.code.highlight });
}


// motor/registro-tipos.js
//
// Punto único donde se conecta cada `exercise.type` con su renderizador y
// su función de calificación (definidos en tipos-ejercicio/*.js). Así el
// motor de sesión (sesion.js / practica.js) nunca necesita un switch por
// tipo: solo llama renderEjercicio() / calificarEjercicio().
//
// NOTA: sin `import` — build.py concatena motor/ y tipos-ejercicio/ en el
// mismo <script>, y las funciones (declaradas con `function`) quedan
// disponibles por hoisting sin importar el orden de concatenación.

const REGISTRO_TIPOS = {
  "single-select": { render: renderSingleSelect, calificar: calificarSingleSelect },
  "multi-select": { render: renderMultiSelect, calificar: calificarMultiSelect },
  "true-false": { render: renderTrueFalse, calificar: calificarTrueFalse },
  "matching": { render: renderMatching, calificar: calificarMatching },
  "dropdown": { render: renderDropdown, calificar: calificarDropdown },
  "code-fill": { render: renderCodeFill, calificar: calificarCodeFill },
  "texto-libre": { render: renderTextoLibre, calificar: calificarTextoLibre },
};

function renderEjercicio(exercise, container, onListo) {
  const entrada = REGISTRO_TIPOS[exercise?.type];
  if (!entrada) {
    container.innerHTML = `<p class="aviso-vacio">⚠️ Tipo de ejercicio desconocido: "${exercise?.type}"</p>`;
    return;
  }
  entrada.render(exercise, container, onListo);
}

function calificarEjercicio(exercise, respuestaUsuario) {
  const entrada = REGISTRO_TIPOS[exercise?.type];
  if (!entrada) return { correcto: false };
  return entrada.calificar(exercise, respuestaUsuario);
}


// motor/reporte.js
//
// Formatea la respuesta del usuario y la respuesta esperada de un ejercicio
// (para el reporte y para el modal de feedback) y arma el texto final del
// reporte de sección con el formato:
//
//   Temario: 1.1 IA responsable (Responsible AI)
//   Equidad: 30%
//   Confiabilidad y seguridad: 100%
//   ...
//
//   Respuestas equivocadas:
//   Equidad, ejercicio 3:
//   {pregunta}
//   Tu respuesta: {...}
//   Respuesta esperada: {...}

function formatearRespuestaUsuario(exercise, respuesta) {
  switch (exercise.type) {
    case "single-select": {
      const opt = (exercise.options || []).find((o) => o.id === respuesta);
      return opt ? opt.text : "(sin respuesta)";
    }
    case "multi-select": {
      const ids = respuesta || [];
      const textos = (exercise.options || []).filter((o) => ids.includes(o.id)).map((o) => o.text);
      return textos.length ? textos.join(", ") : "(sin selección)";
    }
    case "true-false": {
      const labels = exercise.labels || { affirmative: "Verdadero", negative: "Falso" };
      return respuesta ? labels.affirmative : labels.negative;
    }
    case "matching": {
      if (exercise.mode === "sequence") {
        const orden = respuesta || [];
        return orden.map((id) => (exercise.items || []).find((i) => i.id === id)?.text || id).join(" → ");
      }
      const pares = respuesta || [];
      return pares
        .map((p) => {
          const l = (exercise.leftItems || []).find((i) => i.id === p.leftId)?.text || p.leftId;
          const r = (exercise.rightItems || []).find((i) => i.id === p.rightId)?.text || p.rightId;
          return `${l} = ${r}`;
        })
        .join(" · ");
    }
    case "dropdown":
    case "code-fill": {
      const blanks = respuesta || [];
      return blanks.map((b) => b.selected || "(vacío)").join(", ");
    }
    case "texto-libre":
      return respuesta || "(vacío)";
    default:
      return String(respuesta ?? "");
  }
}

function formatearRespuestaEsperada(exercise) {
  switch (exercise.type) {
    case "single-select": {
      const opt = (exercise.options || []).find((o) => o.id === exercise.correctOptionId);
      return opt ? opt.text : exercise.correctOptionId;
    }
    case "multi-select":
      return (exercise.options || [])
        .filter((o) => (exercise.correctOptionIds || []).includes(o.id))
        .map((o) => o.text)
        .join(", ");
    case "true-false": {
      const labels = exercise.labels || { affirmative: "Verdadero", negative: "Falso" };
      return exercise.correctAnswer ? labels.affirmative : labels.negative;
    }
    case "matching": {
      if (exercise.mode === "sequence") {
        return (exercise.correctOrder || []).map((id) => (exercise.items || []).find((i) => i.id === id)?.text || id).join(" → ");
      }
      return (exercise.correctPairs || [])
        .map((p) => {
          const l = (exercise.leftItems || []).find((i) => i.id === p.leftId)?.text || p.leftId;
          const r = (exercise.rightItems || []).find((i) => i.id === p.rightId)?.text || p.rightId;
          return `${l} = ${r}`;
        })
        .join(" · ");
    }
    case "dropdown":
    case "code-fill":
      return (exercise.blanks || []).map((b) => b.correctOption).join(", ");
    case "texto-libre":
      return (exercise.respuestasAceptadas || [])[0] || "";
    default:
      return "";
  }
}

function construirReporteSeccion(seccionId) {
  const estado = getSeccionState(seccionId);
  const meta = getSeccion(seccionId);
  const historial = estado.progreso.historialIntentoActual || [];

  const porSubtema = {};
  const orden = [];
  historial.forEach((h) => {
    if (!porSubtema[h.subtema]) {
      porSubtema[h.subtema] = { total: 0, correctos: 0, items: [] };
      orden.push(h.subtema);
    }
    porSubtema[h.subtema].total++;
    if (h.correcto) porSubtema[h.subtema].correctos++;
    porSubtema[h.subtema].items.push(h);
  });

  const lineas = [`Temario: ${seccionId} ${meta ? meta.titulo : ""}`];

  if (!historial.length) {
    lineas.push("", "(Todavía no hay ejercicios respondidos en esta sección)");
    return lineas.join("\n");
  }

  orden.forEach((sub) => {
    const d = porSubtema[sub];
    const pct = d.total ? Math.round((d.correctos / d.total) * 100) : 0;
    lineas.push(`${sub}: ${pct}%`);
  });

  lineas.push("", "Respuestas equivocadas:");
  let huboFallos = false;
  orden.forEach((sub) => {
    const d = porSubtema[sub];
    d.items.forEach((h, idx) => {
      if (h.correcto) return;
      huboFallos = true;
      lineas.push(`${sub}, ejercicio ${idx + 1}:`);
      lineas.push(h.pregunta);
      lineas.push(`Tu respuesta: ${h.respuestaUsuarioTexto}`);
      lineas.push(`Respuesta esperada: ${h.respuestaEsperadaTexto}`);
      lineas.push("");
    });
  });
  if (!huboFallos) lineas.push("🎉 Ninguna (por ahora).");

  return lineas.join("\n");
}

function copiarReporteSeccion(seccionId) {
  const texto = construirReporteSeccion(seccionId);
  navigator.clipboard
    ?.writeText(texto)
    .then(() => window._toast?.("📋 Reporte copiado al portapapeles"))
    .catch(() => window._toast?.("No se pudo copiar automáticamente — revisa la consola"));
  return texto;
}

function construirReporteReflexiones() {

// motor/sesion.js
//
// Ejecuta UNA lección calificable dentro de un intento de sección.
//
// Flujo por ejercicio:
//   1) obtenerItemActual()      -> qué mostrar
//   2) procesarRespuesta()      -> califica pero NO compromete nada todavía
//      (se guarda en memoria como "pendiente" hasta que el usuario elige)
//   3a) confirmarContinuar()    -> compromete el resultado tal cual salió,
//       actualiza errorBank + historial (para el reporte) y avanza
//   3b) confirmarRepasar()      -> compromete el resultado como EXCLUIDO
//       de la calificación, agrega una copia al final de la cola, y avanza
//
// Al completarse la última lección del intento, se cierra automáticamente
// (verificarCierreIntento): calcula el % final sobre las posiciones NO
// excluidas de TODAS las lecciones y decide aprobado / requiere-reintento.

function obtenerItemActual(seccionId, leccionIndex) {
  const estado = getSeccionState(seccionId);
  const leccion = estado.progreso.intentoActual?.lecciones?.[leccionIndex];
  if (!leccion || leccion.indiceActual >= leccion.cola.length) return null;
  const item = leccion.cola[leccion.indiceActual];
  const exercise = estado.ejercicios.find((e) => e.id === item.exerciseId);
  return { item, exercise, posicion: leccion.indiceActual, leccion, esRepaso: item.excluido };
}

// Califica la respuesta pero no toca errorBank/historial ni avanza el
// puntero — eso solo pasa al confirmar Continuar o Repasar en el modal.
function procesarRespuesta(seccionId, leccionIndex, respuestaUsuario) {
  const actual = obtenerItemActual(seccionId, leccionIndex);
  if (!actual) return null;
  const resultado = calificarEjercicio(actual.exercise, respuestaUsuario);
  return {
    correcto: resultado.correcto,
    respuestaUsuario,
    exercise: actual.exercise,
    posicion: actual.posicion,
  };
}

function confirmarContinuar(seccionId, leccionIndex, pendiente) {
  const estado = getSeccionState(seccionId);
  const leccion = estado.progreso.intentoActual.lecciones[leccionIndex];
  const item = leccion.cola[pendiente.posicion];

  leccion.resultados[pendiente.posicion] = {
    exerciseId: item.exerciseId,
    correcto: pendiente.correcto,
    excluido: item.excluido,
  };

  if (!item.excluido) {
    actualizarErrorBank(estado, item.exerciseId, pendiente.correcto, pendiente.respuestaUsuario);
    estado.progreso.historialIntentoActual.push({
      exerciseId: pendiente.exercise.id,
      subtema: pendiente.exercise.subtopic || pendiente.exercise.topic || "General",
      pregunta: pendiente.exercise.prompt,
      correcto: pendiente.correcto,
      respuestaUsuarioTexto: formatearRespuestaUsuario(pendiente.exercise, pendiente.respuestaUsuario),
      respuestaEsperadaTexto: formatearRespuestaEsperada(pendiente.exercise),
    });
  }

  return avanzarPuntero(seccionId, leccionIndex);
}

function confirmarRepasar(seccionId, leccionIndex, pendiente) {
  const estado = getSeccionState(seccionId);
  const leccion = estado.progreso.intentoActual.lecciones[leccionIndex];
  const item = leccion.cola[pendiente.posicion];

  // Se compromete EXCLUIDO de la calificación (aunque haya sido correcto o
  // incorrecto), y se agrega una copia al final para volver a verlo.
  leccion.resultados[pendiente.posicion] = {
    exerciseId: item.exerciseId,
    correcto: pendiente.correcto,
    excluido: true,
  };
  leccion.cola.push({ exerciseId: item.exerciseId, excluido: true });

  return avanzarPuntero(seccionId, leccionIndex);
}

function actualizarErrorBank(estado, exerciseId, correcto, respuestaUsuario) {
  const eb = estado.progreso.errorBank;
  if (!correcto) {
    const prev = eb[exerciseId] || { vecesFallado: 0 };
    eb[exerciseId] = { vecesFallado: prev.vecesFallado + 1, ultimaRespuesta: respuestaUsuario, resuelto: false };
  } else if (eb[exerciseId]) {
    eb[exerciseId].resuelto = true;
  }
}

// Devuelve { cierre: null } si la lección/el intento siguen abiertos, o
// { cierre: { pct, aprobado } } si esta fue la última lección y el intento
// se acaba de cerrar.
function avanzarPuntero(seccionId, leccionIndex) {
  const estado = getSeccionState(seccionId);
  const leccion = estado.progreso.intentoActual.lecciones[leccionIndex];
  leccion.indiceActual += 1;

  let cierre = null;
  if (leccion.indiceActual >= leccion.cola.length && !leccion.completada) {
    leccion.completada = true;
    estado.progreso.leccionesCompletadas += 1;
    cierre = verificarCierreIntento(seccionId);
  }
  guardarConDebounce();
  return { terminoLeccion: leccion.completada, cierre };
}

function verificarCierreIntento(seccionId) {
  const estado = getSeccionState(seccionId);
  const intento = estado.progreso.intentoActual;
  const todasCompletas = intento.lecciones.every((l) => l.completada);
  if (!todasCompletas) return null;

  let total = 0;
  let aciertos = 0;
  const detalle = {};
  intento.lecciones.forEach((leccion) => {
    leccion.cola.forEach((item, i) => {
      // OJO: se decide por resultados[i].excluido (lo que de verdad se
      // comprometió al confirmar), no por item.excluido (que solo marca
      // "esta posición es una copia reinsertada por [Repasar]"). Un ítem
      // ORIGINAL marcado como [Repasar] tiene item.excluido=false pero
      // resultados[i].excluido=true — y ese es el que debe excluirse.
      const r = leccion.resultados[i];
      if (!r || r.excluido) return;
      total++;
      if (r.correcto) aciertos++;
      detalle[item.exerciseId] = !!r.correcto;
    });
  });

  // % de ESTE intento (solo lo que se contestó ahora)
  const pctIntento = total ? Math.round((aciertos / total) * 100) : 0;

  // Acumulado de la sección: el último resultado de CADA ejercicio calificado.
  // Antes el 90% se medía solo sobre el reintento (fallados + 30% de refuerzo),
  // lo que distorsionaba el resultado. Ahora se mide sobre toda la sección.
  const prog = estado.progreso;
  prog.resultadoPorEjercicio = { ...(prog.resultadoPorEjercicio || {}), ...detalle };
  const idsBanco = estado.ejercicios.map((e) => e.id);
  const calificados = idsBanco.filter((id) => prog.resultadoPorEjercicio[id] !== undefined);
  const correctosSeccion = calificados.filter((id) => prog.resultadoPorEjercicio[id] === true).length;
  const sinCalificar = idsBanco.length - calificados.length;
  const pct = calificados.length ? Math.round((correctosSeccion / calificados.length) * 100) : 0;
  // Aprobar exige el umbral Y haber calificado todos los ejercicios al menos una vez.
  const aprobado = pct >= UMBRAL_APROBACION_PCT && sinCalificar === 0;

  prog.ultimoResultadoDetalle = detalle;
  prog.intentos.push({
    numero: intento.numero,
    esReintento: intento.esReintento,
    pct,
    pctIntento,
    correctosSeccion,
    totalSeccion: idsBanco.length,
    sinCalificar,
    aprobado,
    cerradoEn: new Date().toISOString(),
  });
  prog.mejorPuntajePct = Math.max(prog.mejorPuntajePct, pct);
  prog.estado = aprobado ? "aprobado" : "requiere-reintento";
  guardar();

  return { pct, pctIntento, aprobado, sinCalificar, correctosSeccion, totalSeccion: idsBanco.length };
}


// motor/practica.js
//
// Todo lo de la sección "💡 Aprendizaje": teoría, logros autoreportados
// (checklist, sin verificación automática — el usuario marca "ya lo hice")
// y los ejercicios de práctica NO calificables. Reutilizan renderEjercicio/
// calificarEjercicio y el modal de feedback, pero [Repasar] aquí solo
// reordena dentro de la misma cola de práctica: nunca toca errorBank,
// historial de reporte, ni el % de la sección.

function renderAprendizaje(seccionId, callbacks) {
  const estado = getSeccionState(seccionId);
  const cont = document.getElementById("aprendizajeContainer");
  if (!cont) return;

  const info = estado.info;
  if (!info) {
    cont.innerHTML = `<p class="aviso-vacio">Esta sección todavía no tiene contenido de aprendizaje.</p>`;
    return;
  }

  const teoria = (info.learningContent?.sections || [])
    .map(
      (s) => `
        <div class="teoria-bloque">
          ${s.heading ? `<h3>${escHTML(s.heading)}</h3>` : ""}
          <div class="teoria-cuerpo">${formatearMarkdownBasico(s.body || "")}</div>
        </div>
      `
    )
    .join("");

  const logros = (info.achievements || [])
    .map((logro) => {
      const marcado = !!estado.progreso.logrosMarcados[logro.id];
      return `
        <label class="logro-item">
          <input type="checkbox" data-logro="${logro.id}" ${marcado ? "checked" : ""}>
          <span>${escHTML(logro.texto)}</span>
        </label>
      `;
    })
    .join("");

  const totalPractica = (info.practiceExercises || []).length;
  const practicaEnCurso = estado.progreso.practicaActual;
  const yaEmpezada = practicaEnCurso && practicaEnCurso.indiceActual < practicaEnCurso.cola.length;
  const yaCompleta = practicaEnCurso && practicaEnCurso.indiceActual >= practicaEnCurso.cola.length && practicaEnCurso.cola.length > 0;

  cont.innerHTML = `
    ${info.learningContent?.title ? `<h2>${escHTML(info.learningContent.title)}</h2>` : ""}
    ${teoria || `<p class="aviso-vacio">Sin contenido de teoría todavía.</p>`}

    ${logros ? `<div class="logros-bloque"><h4>🏅 Logros de esta sección</h4>${logros}</div>` : ""}

    ${totalPractica === 0 ? "" : `<div class="practica-bloque">
      <h4>✏️ Práctica (no calificable)</h4>
      <p class="ajustes-nota">${totalPractica} ejercicio(s) de refuerzo.</p>
      <button class="btn btn-solido full" id="btnIniciarPractica">
        ${yaCompleta ? "🔁 Repetir práctica" : yaEmpezada ? "▶ Continuar práctica" : "▶ Comenzar práctica"}
      </button>
    </div>`}
  `;

  cont.querySelectorAll("[data-logro]").forEach((chk) => {
    chk.addEventListener("change", () => {
      estado.progreso.logrosMarcados[chk.dataset.logro] = chk.checked;
      guardarConDebounce();
    });
  });

  cont.querySelector("#btnIniciarPractica")?.addEventListener("click", () => {
    if (yaCompleta) estado.progreso.practicaActual = null; // repetir desde cero
    callbacks.onIniciarPractica(seccionId);
  });
}

// Formateo de la teoría: **negritas**, `código inline`, saltos de línea y
// bloques ```lenguaje ... ``` que se muestran con el mismo estilo que los
// ejercicios de código (ver motor/codigo.js).
function formatearMarkdownBasico(texto) {
  const partes = String(texto ?? "").split(/```(\w+)?\n([\s\S]*?)```/g);
  let html = "";
  for (let i = 0; i < partes.length; i += 3) {
    html += fmtTxt((partes[i] || "").replace(/^\n+|\n+$/g, ""))
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");
    if (i + 2 < partes.length) html += renderBloqueCodigo({ lang: partes[i + 1] || "text", title: "", source: partes[i + 2] });
  }
  return html;
}

// Cola de práctica (no calificable)

function asegurarPracticaActual(seccionId) {
  const estado = getSeccionState(seccionId);
  if (!estado.progreso.practicaActual) {
    const ids = (estado.info?.practiceExercises || []).map((e) => e.id);
    estado.progreso.practicaActual = {
      cola: ids.map((id) => ({ exerciseId: id })),
      indiceActual: 0,
    };
    guardarConDebounce();
  }
  return estado.progreso.practicaActual;
}

function obtenerItemPractica(seccionId) {
  const estado = getSeccionState(seccionId);
  const practica = estado.progreso.practicaActual;
  if (!practica || practica.indiceActual >= practica.cola.length) return null;
  const item = practica.cola[practica.indiceActual];
  const exercise = (estado.info?.practiceExercises || []).find((e) => e.id === item.exerciseId);
  return { exercise, posicion: practica.indiceActual };
}

function procesarRespuestaPractica(seccionId, respuestaUsuario) {
  const actual = obtenerItemPractica(seccionId);
  if (!actual) return null;
  const resultado = calificarEjercicio(actual.exercise, respuestaUsuario);
  return { correcto: resultado.correcto, exercise: actual.exercise, posicion: actual.posicion };
}

function avanzarPunteroPractica(seccionId) {
  const estado = getSeccionState(seccionId);
  const practica = estado.progreso.practicaActual;
  practica.indiceActual += 1;
  guardarConDebounce();
  return practica.indiceActual >= practica.cola.length;
}

function repasarItemPractica(seccionId) {
  const estado = getSeccionState(seccionId);
  const practica = estado.progreso.practicaActual;
  const item = practica.cola[practica.indiceActual];
  practica.cola.push({ exerciseId: item.exerciseId });
  return avanzarPunteroPractica(seccionId);
}


// motor/conceptos.js
//
// Módulo de "Conceptos": un glosario de términos técnicos (SaaS, API, LLM,
// etc.) con repetición espaciada tipo Anki. Cada concepto tiene un nivel de
// 1 a 10; acertar sus ejercicios sube el nivel y programa la próxima
// revisión más lejos en el tiempo; fallar lo baja y la reprograma pronto.
// Reutiliza el mismo renderEjercicio/calificarEjercicio/modal que las
// lecciones — aquí solo vive la lógica de niveles, fechas y reflexiones.

const CONCEPTOS_NIVEL_MIN = 1;
const CONCEPTOS_NIVEL_MAX = 10;

// Horas hasta la próxima revisión, según el nivel alcanzado (índice = nivel-1).
// Nivel 1 se repasa en unas horas; nivel 10, cada mes y medio — curva típica
// de un sistema de repetición espaciada.
const CONCEPTOS_INTERVALOS_HORAS = [4, 8, 24, 48, 96, 168, 288, 480, 720, 1080];

// Cuántos conceptos NUNCA estudiados se introducen como máximo por día —
// para que el primer día no aparezcan los 180 de una sola vez. Los repasos
// ya vencidos (conceptos que ya se estudiaron antes) NO tienen este límite:
// siempre se muestran todos, como en cualquier sistema de repetición
// espaciada real.
const CONCEPTOS_NUEVOS_POR_DIA = 12;

function horasDesdeAhora(horas) {
  return new Date(Date.now() + horas * 3600 * 1000).toISOString();
}

function conceptoEstaParaHoy(progreso) {
  if (!progreso.proximaRevision) return true;
  return new Date(progreso.proximaRevision).getTime() <= Date.now();
}

function contarNuevosIntroducidosHoy() {
  const hoyStr = new Date().toISOString().slice(0, 10);
  let cuenta = 0;
  Object.values(AppState.conceptos).forEach((p) => {
    if (p.historial.length && p.historial[0].fecha.slice(0, 10) === hoyStr) cuenta++;
  });
  return cuenta;
}

// Devuelve los conceptos para hoy: TODOS los repasos ya vencidos (sin
// límite) + conceptos nunca estudiados hasta agotar el cupo diario.
function conceptosDeHoy() {
  const catalogo = AppState.conceptosCatalogo || [];
  const vencidos = [];
  const nuevos = [];

  catalogo.forEach((c) => {
    const p = getConceptoState(c.id);
    if (!conceptoEstaParaHoy(p)) return;
    if (p.proximaRevision === null) nuevos.push(c);
    else vencidos.push(c);
  });

  vencidos.sort((a, b) => (getConceptoState(a.id).proximaRevision || "").localeCompare(getConceptoState(b.id).proximaRevision || ""));

  const cupoRestante = Math.max(0, CONCEPTOS_NUEVOS_POR_DIA - contarNuevosIntroducidosHoy());
  return { lista: [...vencidos, ...nuevos.slice(0, cupoRestante)], nuevosEnEspera: Math.max(0, nuevos.length - cupoRestante) };
}

function iniciarRepasoConcepto(conceptoId) {
  const progreso = getConceptoState(conceptoId);
  const concepto = (AppState.conceptosCatalogo || []).find((c) => c.id === conceptoId);
  if (!concepto) return null;
  progreso.repasoActual = {
    cola: concepto.ejercicios.map((e) => ({ exerciseId: e.id, excluido: false })),
    indiceActual: 0,
    resultados: {},
  };
  guardarConDebounce();
  return progreso.repasoActual;
}

function obtenerItemRepasoConcepto(conceptoId) {
  const progreso = getConceptoState(conceptoId);
  const repaso = progreso.repasoActual;
  const concepto = (AppState.conceptosCatalogo || []).find((c) => c.id === conceptoId);
  if (!repaso || !concepto || repaso.indiceActual >= repaso.cola.length) return null;
  const item = repaso.cola[repaso.indiceActual];
  const exercise = concepto.ejercicios.find((e) => e.id === item.exerciseId);
  return { item, exercise, posicion: repaso.indiceActual, esRepaso: item.excluido };
}

function procesarRespuestaConcepto(conceptoId, respuestaUsuario) {
  const actual = obtenerItemRepasoConcepto(conceptoId);
  if (!actual) return null;
  const resultado = calificarEjercicio(actual.exercise, respuestaUsuario);
  return {
    correcto: resultado.correcto,
    esReflexion: !!resultado.esReflexion,
    respuestaUsuario,
    exercise: actual.exercise,
    posicion: actual.posicion,
  };
}

function confirmarContinuarConcepto(conceptoId, pendiente) {
  const progreso = getConceptoState(conceptoId);
  const repaso = progreso.repasoActual;
  const item = repaso.cola[pendiente.posicion];
  const concepto = (AppState.conceptosCatalogo || []).find((c) => c.id === conceptoId);
  // Una reflexión queda excluida de la calificación del concepto, igual que
  // una copia reinsertada por [Repasar] — no tiene "correcto/incorrecto".
  const excluido = item.excluido || pendiente.esReflexion;
  repaso.resultados[pendiente.posicion] = { correcto: pendiente.correcto, excluido };

  if (pendiente.esReflexion) {
    AppState.reflexiones.push({
      conceptoId,
      termino: concepto ? concepto.termino : conceptoId,
      pregunta: pendiente.exercise.prompt,
      texto: pendiente.respuestaUsuario,
      fecha: new Date().toISOString(),
    });
  }

  return avanzarRepasoConcepto(conceptoId);
}

function confirmarRepasarConcepto(conceptoId, pendiente) {
  const progreso = getConceptoState(conceptoId);
  const repaso = progreso.repasoActual;
  const item = repaso.cola[pendiente.posicion];
  // Al mandar a repasar NO se guarda la reflexión de este intento (se
  // guardará la próxima vez que se confirme con Continuar).
  repaso.resultados[pendiente.posicion] = { correcto: pendiente.correcto, excluido: true };
  repaso.cola.push({ exerciseId: item.exerciseId, excluido: true });
  return avanzarRepasoConcepto(conceptoId);
}

function avanzarRepasoConcepto(conceptoId) {
  const progreso = getConceptoState(conceptoId);
  const repaso = progreso.repasoActual;
  repaso.indiceActual += 1;

  let cierre = null;
  if (repaso.indiceActual >= repaso.cola.length) {
    cierre = cerrarRepasoConcepto(conceptoId);
  }
  guardarConDebounce();
  return { termino: repaso.indiceActual >= repaso.cola.length, cierre };
}

function cerrarRepasoConcepto(conceptoId) {
  const progreso = getConceptoState(conceptoId);
  const repaso = progreso.repasoActual;

  let total = 0;
  let aciertos = 0;
  repaso.cola.forEach((item, i) => {
    const r = repaso.resultados[i];
    if (!r || r.excluido) return;
    total++;
    if (r.correcto) aciertos++;
  });

  // Ajuste de nivel: 100% -> +2, 2/3 o más -> +1, menos de la mitad -> -2.
  // Si TODO el repaso eran reflexiones (total=0), el nivel no se toca.
  if (total > 0) {
    const ratio = aciertos / total;
    let delta;
    if (ratio === 1) delta = 2;
    else if (ratio >= 0.6) delta = 1;
    else delta = -2;
    progreso.nivel = Math.min(CONCEPTOS_NIVEL_MAX, Math.max(CONCEPTOS_NIVEL_MIN, progreso.nivel + delta));
  }

  progreso.proximaRevision = horasDesdeAhora(CONCEPTOS_INTERVALOS_HORAS[progreso.nivel - 1]);
  progreso.historial.push({ fecha: new Date().toISOString(), aciertos, total });
  progreso.repasoActual = null;
  guardarConDebounce();

  return { nivel: progreso.nivel, proximaRevision: progreso.proximaRevision, aciertos, total };
}
