<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#38bdf8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI-901 Trainer" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <title>AI-901 Trainer</title>
  <style>/* estilos/main.css — AI-901 Trainer — mobile-first, oscuro, azul cielo */

:root {
  --bg: #060a13;
  --bg-elev: #0c1424;
  --bg-card: #101b30;
  --bg-card-hover: #16233c;
  --border: #1f2f4d;
  --border-soft: #182640;
  --text: #eef2fb;
  --text-dim: #94a6c4;
  --text-faint: #5f7092;
  --accent: #38bdf8;
  --accent-strong: #0ea5e9;
  --accent-soft: rgba(56, 189, 248, 0.14);
  --accent-glow: rgba(56, 189, 248, 0.35);
  --success: #34d399;
  --success-soft: rgba(52, 211, 153, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --warning: #fbbf24;
  --dom2: #a78bfa;
  --dom2-soft: rgba(167, 139, 250, 0.14);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 11px;
  --radius-pill: 999px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabbar-h: 64px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body {
  background:
    radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.12), transparent 40%),
    radial-gradient(circle at 90% 15%, rgba(167, 139, 250, 0.08), transparent 35%),
    radial-gradient(circle at 10% 100%, rgba(14, 165, 233, 0.08), transparent 40%),
    var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
}

button, input, select, textarea { font-family: inherit; }
button { touch-action: manipulation; }

/* ---------- Layout mobile-first ---------- */

.app-container {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 8px);
}

.screen {
  display: none;
  padding: 14px 16px;
  padding-bottom: 40px;
}
.screen.active {
  display: block;
  animation: pantallaEntra 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.screen.screen-entrando { opacity: 0; }

@keyframes pantallaEntra {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: rgba(6, 10, 19, 0.78);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
}

.marca { display: flex; align-items: center; gap: 10px; }

.marca-logo {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: #041423;
  font-size: 0.85rem;
  box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
  animation: logoPulso 4s ease-in-out infinite;
}
@keyframes logoPulso {
  0%, 100% { box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35); }
  50% { box-shadow: 0 4px 22px rgba(56, 189, 248, 0.55); }
}

.marca-titulo { font-weight: 700; font-size: 1rem; letter-spacing: 0.2px; }
.marca-sub { font-size: 0.68rem; color: var(--text-faint); }

/* ---------- Barra de navegación inferior (mobile) ---------- */

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  max-width: 480px;
  margin: 0 auto;
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: flex;
  background: rgba(9, 14, 26, 0.9);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-soft);
}

.tabbar-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  transition: color 0.15s ease, transform 0.15s ease;
}
.tabbar-btn .tabbar-icono { font-size: 1.25rem; transition: transform 0.2s ease; }
.tabbar-btn .tabbar-label { font-size: 0.66rem; font-weight: 600; }
.tabbar-btn.active { color: var(--accent); }
.tabbar-btn.active .tabbar-icono { transform: translateY(-2px) scale(1.08); }
.tabbar-btn:active { transform: scale(0.94); }

/* ---------- Botones ---------- */

.btn {
  appearance: none;
  border: 1.5px solid var(--accent);
  background: transparent;
  color: var(--accent);
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover:not(:disabled) { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-glow); }
.btn:active:not(:disabled) { transform: scale(0.95); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-solido {
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  color: #041423;
  border: none;
  box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
}
.btn-solido:hover:not(:disabled) { filter: brightness(1.08); }
.btn-solido:active:not(:disabled) { transform: scale(0.95); box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3); }

.btn-peligro { border-color: var(--danger); color: var(--danger); }
.btn-peligro:hover:not(:disabled) { background: var(--danger-soft); box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.25); }

.btn-icono {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.1rem;
  transition: transform 0.12s ease, border-color 0.15s ease;
}
.btn-icono:hover { border-color: var(--accent); color: var(--accent); }
.btn-icono:active { transform: scale(0.9); }

.full { width: 100%; justify-content: center; }

/* ---------- Secciones (pantalla principal) ---------- */

.bloque-dominio { margin-bottom: 26px; }
.bloque-dominio:nth-child(2) .tarjeta-seccion-id { background: var(--dom2-soft); color: var(--dom2); }

.bloque-dominio-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 12px;
}
.bloque-dominio-header h2 { font-size: 1rem; margin: 0; }
.bloque-dominio-peso { font-size: 0.72rem; color: var(--text-faint); }

.grid-secciones {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.tarjeta-seccion {
  text-align: left;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 13px;
  cursor: pointer;
  color: var(--text);
  transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.15s ease, background 0.15s ease;
  display: flex;
  flex-direction: column;
  gap: 7px;
  opacity: 0;
  animation: tarjetaEntra 0.35s ease forwards;
}
.grid-secciones .tarjeta-seccion:nth-child(1) { animation-delay: 0.02s; }
.grid-secciones .tarjeta-seccion:nth-child(2) { animation-delay: 0.07s; }
.grid-secciones .tarjeta-seccion:nth-child(3) { animation-delay: 0.12s; }
.grid-secciones .tarjeta-seccion:nth-child(4) { animation-delay: 0.17s; }

@keyframes tarjetaEntra {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.tarjeta-seccion:active:not(:disabled) { transform: scale(0.96); background: var(--bg-card-hover); }
.tarjeta-seccion.bloqueada {
  cursor: not-allowed;
  animation: none;
  opacity: 1;
  background: transparent;
  border-style: dashed;
  border-color: var(--border-soft);
}
.tarjeta-seccion.bloqueada .tarjeta-seccion-id { background: transparent; border: 1px dashed var(--border-soft); color: var(--text-faint); }
.tarjeta-seccion.bloqueada .tarjeta-seccion-titulo,
.tarjeta-seccion.bloqueada .tarjeta-seccion-meta { color: var(--text-faint); }

.tarjeta-seccion-top { display: flex; justify-content: space-between; align-items: center; }
.tarjeta-seccion-id {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}
.tarjeta-seccion-icono { font-size: 1rem; }
.tarjeta-seccion-titulo { font-size: 0.84rem; font-weight: 600; line-height: 1.3; }
.tarjeta-seccion-meta { display: flex; flex-direction: column; gap: 2px; font-size: 0.68rem; color: var(--text-faint); }
.tarjeta-seccion-estado { color: var(--text-dim); }

/* ---------- Lecciones ---------- */

.lecciones-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.lecciones-acciones { display: flex; gap: 8px; flex-wrap: wrap; }

.grid-lecciones {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.caja-leccion {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 6px;
  cursor: pointer;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.15s ease, background 0.15s ease;
  opacity: 0;
  animation: tarjetaEntra 0.3s ease forwards;
}
.caja-leccion:active:not(:disabled) { transform: scale(0.92); }

.caja-leccion .caja-leccion-numero {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem; font-weight: 800;
  background: var(--accent-soft); color: var(--accent);
}

.caja-leccion.actual {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  animation: tarjetaEntra 0.3s ease forwards, latido 2s ease-in-out 0.4s infinite;
}
.caja-leccion.actual .caja-leccion-numero { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #041423; }

.caja-leccion.completada { border-color: var(--success); background: var(--success-soft); }
.caja-leccion.completada .caja-leccion-numero { background: var(--success); color: #052b1c; }
.caja-leccion.completada .caja-leccion-info { color: var(--success); font-weight: 600; }

/* Bloqueada: un estado propio y legible, no una versión "apagada" del resto */
.caja-leccion.bloqueada {
  cursor: not-allowed;
  animation: none;
  opacity: 1;
  background: transparent;
  border-style: dashed;
  border-color: var(--border-soft);
}
.caja-leccion.bloqueada .caja-leccion-numero { background: transparent; border: 1.5px dashed var(--border-soft); color: var(--text-faint); font-size: 0.85rem; }
.caja-leccion.bloqueada .caja-leccion-info { color: var(--text-faint); font-size: 0.6rem; }

@keyframes latido {
  0%, 100% { box-shadow: 0 0 0 3px var(--accent-glow); }
  50% { box-shadow: 0 0 0 6px transparent; }
}

.caja-leccion-barra { width: 100%; height: 4px; background: var(--border); border-radius: var(--radius-pill); overflow: hidden; }
.caja-leccion-barra-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width 0.3s ease; }
.caja-leccion-info { font-size: 0.64rem; color: var(--text-faint); text-align: center; }

.aviso-vacio { text-align: center; color: var(--text-faint); padding: 40px 16px; font-size: 0.88rem; line-height: 1.5; }

.banner-estado {
  display: flex; flex-direction: column; gap: 8px;
  padding: 13px 16px; border-radius: var(--radius-md); margin-bottom: 16px; font-size: 0.85rem;
  animation: tarjetaEntra 0.3s ease;
}
.banner-exito { background: var(--success-soft); border: 1px solid var(--success); color: var(--success); }
.banner-alerta { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger); }

/* ---------- Ejercicio: pregunta + opciones ---------- */

.pregunta-prompt { font-size: 1.05rem; font-weight: 600; line-height: 1.4; margin-bottom: 16px; animation: tarjetaEntra 0.3s ease; }

.opciones-lista { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.opciones-vf { flex-direction: row; }
.opciones-vf .opcion-btn { flex: 1; text-align: center; }

.opcion-btn {
  text-align: left;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  color: var(--text);
  font-size: 0.9rem;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.12s ease, background 0.12s ease;
  opacity: 0;
  animation: tarjetaEntra 0.3s ease forwards;
}
.opciones-lista .opcion-btn:nth-child(1) { animation-delay: 0.02s; }
.opciones-lista .opcion-btn:nth-child(2) { animation-delay: 0.06s; }
.opciones-lista .opcion-btn:nth-child(3) { animation-delay: 0.1s; }
.opciones-lista .opcion-btn:nth-child(4) { animation-delay: 0.14s; }
.opcion-btn:active { transform: scale(0.97); }
.opcion-btn.seleccionada { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-glow); }
.opcion-check { margin-right: 4px; }

.ejercicio-acciones { display: flex; justify-content: center; margin-top: 10px; }
.ejercicio-acciones .btn { min-width: 200px; justify-content: center; }

/* ---------- Emparejamiento ---------- */

.emparejar-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.emparejar-col { display: flex; flex-direction: column; gap: 8px; }
.opcion-emparejar { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; padding: 10px 8px; }
.opcion-emparejar.activo { border-color: var(--warning); box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25); }
.opcion-emparejar.pareado { border-color: var(--success); background: var(--success-soft); animation: pop 0.25s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
.emparejar-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--success); color: #052b1c; font-size: 0.66rem; font-weight: 800; flex-shrink: 0;
}

/* ---------- Secuencia ---------- */

.secuencia-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.secuencia-fila {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 10px 12px;
  transition: transform 0.15s ease;
}
.secuencia-numero {
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
}
.secuencia-texto { flex: 1; font-size: 0.85rem; }
.secuencia-flechas { display: flex; gap: 4px; }
.btn-mini { width: 30px; height: 30px; font-size: 0.85rem; }

/* ---------- Dropdown ---------- */

.dropdown-texto { line-height: 2.3; }
.dropdown-select {
  background: var(--bg-card); border: 1.5px solid var(--accent); color: var(--accent);
  border-radius: var(--radius-sm); padding: 4px 8px; font-size: 0.86rem; margin: 0 2px;
}

/* ---------- Texto libre ---------- */

.texto-libre-area { margin-bottom: 16px; }
.texto-libre-input {
  width: 100%;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  font-size: 1rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.texto-libre-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* ---------- Definición (primera vez que se estudia un concepto) ---------- */

.definicion-banner {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--text);
  animation: tarjetaEntra 0.3s ease;
}
.definicion-banner strong { color: var(--accent); }

/* ---------- Modal (bottom sheet, siempre desde abajo en mobile) ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 6, 12, 0.72);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  animation: overlayEntra 0.2s ease;
}
.modal-overlay.modal-activo { display: flex; }
@keyframes overlayEntra { from { opacity: 0; } to { opacity: 1; } }

.modal-tarjeta {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  animation: sheetSube 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes sheetSube { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-ajustes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-cerrar { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; cursor: pointer; }

.ajustes-seccion { margin-bottom: 20px; }
.ajustes-seccion h4 { font-size: 0.78rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
.ajustes-fila { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.ajustes-nota { font-size: 0.74rem; color: var(--text-dim); margin-top: 8px; }

.btn-ajustes {
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  border-radius: var(--radius-pill); padding: 9px 16px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  transition: transform 0.1s ease;
}
.btn-ajustes:active { transform: scale(0.95); }
.btn-ajustes.full { width: 100%; justify-content: center; display: flex; margin-top: 6px; }

.select-ajustes {
  flex: 1; min-width: 140px; background: var(--bg-card); border: 1.5px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: 9px 10px; font-size: 0.8rem;
}

/* ---------- Feedback de respuesta ---------- */

.modal-feedback.feedback-correcto { border-top: 3px solid var(--success); }
.modal-feedback.feedback-incorrecto { border-top: 3px solid var(--danger); }
.modal-feedback.feedback-reflexion { border-top: 3px solid var(--accent); }
.feedback-encabezado { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.feedback-icono { font-size: 1.7rem; animation: pop 0.35s ease; }
.feedback-titulo { font-size: 1.1rem; font-weight: 700; }
.feedback-explicacion { color: var(--text-dim); font-size: 0.89rem; line-height: 1.55; margin-bottom: 20px; }
.modal-botones { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Aprendizaje: teoría, logros, práctica ---------- */

.teoria-bloque { margin-bottom: 18px; animation: tarjetaEntra 0.3s ease; }
.teoria-bloque h3 { font-size: 0.94rem; margin: 0 0 8px; color: var(--accent); }
.teoria-cuerpo { font-size: 0.87rem; line-height: 1.6; color: var(--text-dim); }

.logros-bloque { margin: 22px 0; padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
.logros-bloque h4 { margin: 0 0 10px; font-size: 0.82rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.logro-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-size: 0.86rem; cursor: pointer; }
.logro-item input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; }

.practica-bloque { margin: 18px 0; padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); }
.practica-bloque h4 { margin: 0 0 4px; font-size: 0.82rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }

/* ---------- Conceptos (glosario con repetición espaciada) ---------- */

.conceptos-subtitulo { font-size: 0.86rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 10px; }
.conceptos-subtitulo:first-child { margin-top: 4px; }

.lista-conceptos { display: flex; flex-direction: column; gap: 8px; }

.tarjeta-concepto {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 12px 14px; text-align: left; color: var(--text); cursor: pointer;
  transition: transform 0.13s ease, border-color 0.13s ease;
  opacity: 0; animation: tarjetaEntra 0.3s ease forwards;
}
.tarjeta-concepto:active { transform: scale(0.97); }
.tarjeta-concepto:hover { border-color: var(--accent); }

.concepto-nivel-anillo {
  --pct: 10%;
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; font-weight: 800; color: var(--accent);
  background: conic-gradient(var(--accent) var(--pct), var(--border) 0);
  position: relative;
}
.concepto-nivel-anillo::before {
  content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg-card);
}
.concepto-nivel-numero { position: relative; z-index: 1; }

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 14px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-elev);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 10px 18px;
  border-radius: var(--radius-pill);
  font-size: 0.83rem;
  opacity: 0;
  transition: all 0.25s ease;
  z-index: 200;
  pointer-events: none;
  max-width: 88vw;
  text-align: center;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Scrollbar sutil ---------- */

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); }
::-webkit-scrollbar-track { background: transparent; }

/* Respeta a quien prefiere menos movimiento */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}


/* =====================================================================
   PARTE 1 — iconos de Azure, código, peso del examen y simulacro
   ===================================================================== */

:root {
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
  --code-bg: #0a1227;
  --code-bg-2: #0d1730;
}

/* ---------- Opciones con icono / texto ---------- */

.opcion-btn { display: flex; align-items: center; gap: 12px; }
.opciones-vf .opcion-btn { justify-content: center; }
.opcion-texto { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opcion-codigo code { font-family: var(--mono); font-size: 0.8rem; color: #dbe7fb; }
.dropdown-instruccion { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }

/* ---------- Iconos de Azure ---------- */

.icono-tile {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04));
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.icono-tile img { display: block; width: 66%; height: 66%; object-fit: contain; pointer-events: none; }
.icono-sm { width: 36px; height: 36px; border-radius: 10px; }
.icono-md { width: 46px; height: 46px; }
.icono-lg { width: 64px; height: 64px; border-radius: 18px; }
.icono-xl { width: 96px; height: 96px; border-radius: 24px; }
.ej-imagen { display: flex; justify-content: center; margin: 2px 0 14px; animation: tarjetaEntra 0.3s ease; }
.opcion-emparejar .icono-tile { margin: 0 auto; }

/* ---------- Texto con `código inline` ---------- */

.cod-inline {
  font-family: var(--mono); font-size: 0.86em; color: #7dd3fc;
  background: rgba(56, 189, 248, 0.11); border: 1px solid rgba(56, 189, 248, 0.22);
  padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere;
}

/* ---------- Bloque de código ---------- */

.codigo {
  margin: 0 0 16px; border-radius: 16px; overflow: hidden;
  border: 1px solid #1f3159;
  background: linear-gradient(180deg, var(--code-bg-2), var(--code-bg));
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(56, 189, 248, 0.04);
  font-family: var(--mono);
  animation: tarjetaEntra 0.3s ease;
}
.codigo-barra {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  background: linear-gradient(180deg, #14213f, #101b35);
  border-bottom: 1px solid #1c2c4f;
}
.codigo-dots { display: flex; gap: 5px; flex-shrink: 0; }
.codigo-dots i { width: 9px; height: 9px; border-radius: 50%; background: #ff6159; opacity: 0.9; }
.codigo-dots i:nth-child(2) { background: #ffbd2e; }
.codigo-dots i:nth-child(3) { background: #28ca41; }
.codigo-titulo {
  flex: 1; min-width: 0; font: 600 0.72rem var(--font); color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.codigo-lang {
  font: 700 0.58rem var(--font); letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(56, 189, 248, 0.3);
  padding: 2px 8px; border-radius: var(--radius-pill); flex-shrink: 0;
}
.codigo-copiar {
  font: 600 0.66rem var(--font); color: var(--text-dim); background: rgba(255, 255, 255, 0.05);
  border: 1px solid #25375e; border-radius: var(--radius-pill); padding: 3px 10px; cursor: pointer; flex-shrink: 0;
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.codigo-copiar:hover { color: var(--accent); border-color: var(--accent); }
.codigo-copiar.ok { color: var(--success); border-color: var(--success); background: var(--success-soft); }

.codigo-cuerpo {
  overflow-x: auto; padding: 12px 0; font-size: 0.78rem; line-height: 1.65; tab-size: 4;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #25375e transparent;
}
.codigo-cuerpo:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.codigo-compacto .codigo-cuerpo { padding: 8px 0; }
.cl { display: flex; min-width: max-content; padding-right: 18px; }
.cn {
  position: sticky; left: 0; flex: 0 0 auto; width: 3.1em; padding-right: 0.9em; text-align: right;
  color: #3f5482; user-select: none; background: var(--code-bg); z-index: 1;
}
.cc { white-space: pre; color: #dbe7fb; }
.cl.hl { background: linear-gradient(90deg, rgba(56, 189, 248, 0.17), rgba(56, 189, 248, 0.03)); box-shadow: inset 3px 0 0 var(--accent); }
.cl.hl .cn { background: #0e2347; color: var(--accent); }

.tk-kw { color: #c4a7ff; }
.tk-cn, .tk-bi { color: #f0abfc; }
.tk-st { color: #86efac; }
.tk-ip { color: #fcd34d; }
.tk-nm { color: #fbbf24; }
.tk-cm { color: #5d7298; font-style: italic; }
.tk-dc { color: #fb923c; }
.tk-fd, .tk-fn { color: #60c8fb; }
.tk-cl { color: #67e8f9; }
.tk-md { color: #93c5fd; }
.tk-at { color: #cbd5e1; }
.tk-pm { color: #fdba74; }
.tk-ev { color: #fcd34d; }
.tk-op, .tk-pn { color: #7f93b8; }
.tk-vr, .tk-tx { color: #e6edf9; }
.tk-jk { color: #7dd3fc; }
.tk-tg { color: #f9a8d4; }

/* huecos de "completa el código" */
.cf-select {
  font: inherit; font-size: 0.95em; color: var(--accent); background: rgba(56, 189, 248, 0.12);
  border: 1.5px dashed var(--accent); border-radius: 8px; padding: 0 6px; margin: 0 1px; cursor: pointer;
  max-width: 62vw; line-height: 1.5; vertical-align: baseline;
}
.cf-select.lleno { border-style: solid; background: rgba(56, 189, 248, 0.2); color: #e0f2fe; }
.cf-select:focus { outline: 2px solid var(--accent-glow); }
.cf-select option { background: #0c1424; color: #eef2fb; font-family: var(--mono); }
.cf-nota { margin: -6px 0 12px; }
.cf-res { font: inherit; border-radius: 6px; padding: 0 5px; }
.cf-res.ok { background: rgba(52, 211, 153, 0.18); color: #86efac; }
.cf-res.mal { background: var(--danger-soft); color: #fca5a5; text-decoration: line-through; margin-right: 4px; }
.feedback-codigo { margin: 4px 0 12px; }
.feedback-codigo .codigo { margin: 0; animation: none; }

.seq-code { font-family: var(--mono); font-size: 0.74rem; white-space: pre-wrap; overflow-wrap: normal; word-break: normal; }
.secuencia-texto.es-codigo { background: var(--code-bg); border-radius: 8px; padding: 6px 9px; min-width: 0; overflow-x: auto; }
.opcion-emparejar .seq-code { overflow-wrap: anywhere; }

/* ---------- Peso en el examen (tarjetas de sección) ---------- */

.peso-examen { display: flex; flex-direction: column; gap: 3px; font-size: 0.66rem; color: var(--text-dim); }
.peso-examen-barra { height: 4px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.peso-examen-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--dom2)); border-radius: inherit; }
.tarjeta-seccion.recomendada { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 24px rgba(56, 189, 248, 0.12); }
.tarjeta-seccion.recomendada .tarjeta-seccion-estado { color: var(--accent); font-weight: 700; }
.banner-estado small { opacity: 0.85; }

/* ---------- Simulacro ---------- */

body.en-simulacro .tabbar { display: none; }
body.en-simulacro .app-container { padding-bottom: 24px; }

.sim-hero { text-align: center; padding: 6px 4px 14px; }
.sim-hero-icono { font-size: 2.1rem; margin-bottom: 4px; }
.sim-hero h2 { margin: 0 0 6px; font-size: 1.25rem; }
.sim-hero p { margin: 0; color: var(--text-dim); font-size: 0.84rem; line-height: 1.55; }
.sim-sub { font-size: 0.74rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin: 20px 0 10px; }
.sim-pesos { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.sim-fila { display: grid; grid-template-columns: 30px 1fr 64px 22px; align-items: center; gap: 8px; font-size: 0.76rem; }
.sim-fila.vacia { opacity: 0.45; }
.sim-fila-id { font-weight: 700; color: var(--accent); }
.sim-fila-nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
.sim-fila-barra { height: 6px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.sim-fila-barra div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius: inherit; }
.sim-fila-n { text-align: right; font-weight: 700; }
.sim-encurso {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius-md);
  padding: 12px 14px; margin-bottom: 14px; font-size: 0.82rem; line-height: 1.5;
}
.sim-hist { display: flex; flex-direction: column; gap: 8px; }
.sim-hist-item {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 10px 14px; color: var(--text); cursor: pointer;
}
.sim-hist-pct { font-weight: 800; font-size: 1.05rem; min-width: 54px; }
.sim-hist-pct.ok { color: var(--success); }
.sim-hist-pct.mal { color: var(--danger); }
.sim-hist-meta { flex: 1; font-size: 0.74rem; color: var(--text-dim); }
.sim-hist-ir { color: var(--text-faint); font-size: 1.2rem; }

.sim-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sim-timer { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 0.95rem; color: var(--accent); }
.sim-timer.poco { color: var(--danger); animation: latidoTexto 1s ease-in-out infinite; }
@keyframes latidoTexto { 50% { opacity: 0.45; } }
.sim-contador { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }
.sim-flag {
  width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--bg-card);
  color: var(--text-faint); font-size: 1rem; cursor: pointer; transition: all 0.15s ease;
}
.sim-flag.activa { color: var(--warning); border-color: var(--warning); background: rgba(251, 191, 36, 0.14); }
.sim-barra { height: 5px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; margin-bottom: 16px; }
.sim-barra div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width 0.3s ease; }
.sim-ya { font-size: 0.76rem; color: var(--success); background: var(--success-soft); border-radius: var(--radius-sm); padding: 7px 10px; margin-bottom: 12px; }
.sim-nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
.sim-nav .btn { flex: 1; justify-content: center; padding-left: 8px; padding-right: 8px; font-size: 0.8rem; }

.sim-resumen-txt { font-size: 0.9rem; margin: 6px 0 14px; }
.txt-alerta { color: var(--warning); }
.sim-mapa { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
.sim-chip {
  position: relative; aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed var(--border);
  background: transparent; color: var(--text-faint); font-weight: 700; font-size: 0.84rem; cursor: pointer;
}
.sim-chip.resp { border-style: solid; border-color: rgba(56, 189, 248, 0.5); background: var(--accent-soft); color: var(--text); }
.sim-chip.marc { border-color: var(--warning); }
.sim-chip.actual { box-shadow: 0 0 0 3px var(--accent-glow); }
.sim-chip i { position: absolute; top: 1px; right: 4px; font-style: normal; font-size: 0.62rem; color: var(--warning); }
.sim-leyenda { display: flex; gap: 14px; font-size: 0.68rem; color: var(--text-faint); margin-bottom: 18px; flex-wrap: wrap; }
.sim-leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; border: 1.5px dashed var(--border); vertical-align: -1px; }
.sim-leyenda i.resp { border-style: solid; border-color: rgba(56, 189, 248, 0.5); background: var(--accent-soft); }
.sim-leyenda i.marc { border-style: solid; border-color: var(--warning); }
.sim-resumen-txt + .sim-mapa + .sim-leyenda ~ .btn { margin-top: 8px; }

.sim-res { position: relative; }
.sim-res-volver { position: absolute; top: -2px; left: 0; }
.sim-res-hero {
  display: flex; align-items: center; gap: 16px; margin: 34px 0 6px; padding: 16px;
  border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--bg-card);
}
.sim-res-hero.ok { border-color: rgba(52, 211, 153, 0.5); background: linear-gradient(135deg, rgba(52, 211, 153, 0.12), var(--bg-card)); }
.sim-res-hero.mal { border-color: rgba(248, 113, 113, 0.45); background: linear-gradient(135deg, rgba(248, 113, 113, 0.10), var(--bg-card)); }
.anillo { width: 118px; height: 118px; flex-shrink: 0; }
.anillo-pct { fill: var(--text); font-size: 26px; font-weight: 800; }
.anillo-sub { fill: var(--text-faint); font-size: 8px; }
.sim-res-titulo { font-weight: 800; font-size: 1.02rem; margin-bottom: 4px; }
.sim-res-sub { font-size: 0.76rem; color: var(--text-dim); line-height: 1.5; }
.res-fila { display: grid; grid-template-columns: minmax(0, 1fr) 90px 48px; gap: 10px; align-items: center; margin-bottom: 9px; font-size: 0.78rem; }
.res-fila-et small { color: var(--text-faint); }
.res-fila-n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.res-barra { height: 7px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.res-barra div { height: 100%; border-radius: inherit; }
.res-barra .ok { background: var(--success); }
.res-barra .medio { background: var(--warning); }
.res-barra .mal { background: var(--danger); }
.res-habs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.res-habs li { display: flex; justify-content: space-between; gap: 12px; font-size: 0.8rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; }
.res-habs b { color: var(--danger); }
.sim-res-acciones { display: flex; flex-direction: column; gap: 8px; margin: 20px 0 6px; }
.sim-res-acciones .btn { justify-content: center; }
.res-fallo { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px; }
.res-fallo summary { cursor: pointer; padding: 11px 14px; font-size: 0.82rem; line-height: 1.45; list-style: none; }
.res-fallo summary::-webkit-details-marker { display: none; }
.res-fallo-sec { display: inline-block; font-size: 0.66rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: var(--radius-pill); margin-right: 6px; }
.res-fallo-cuerpo { padding: 2px 14px 14px; }
.res-linea { font-size: 0.8rem; line-height: 1.5; margin: 6px 0; }
.res-expl { font-size: 0.8rem; color: var(--text-dim); line-height: 1.55; margin: 8px 0 0; }
.res-fallo .codigo { margin: 8px 0; animation: none; }


/* ---------- Retoques de la Parte 1 ---------- */

.ej-dinamico.ya-pintado .opcion-btn { animation: none; opacity: 1; }

/* fondo sólido (sin franja más oscura en los números) + sombra a la derecha si el código se desplaza */
.codigo { background: var(--code-bg); }
.codigo-cuerpo {
  background:
    linear-gradient(to left, var(--code-bg) 35%, rgba(10, 18, 39, 0)) right / 44px 100% no-repeat local,
    radial-gradient(farthest-side at 100% 50%, rgba(56, 189, 248, 0.32), rgba(56, 189, 248, 0)) right / 16px 100% no-repeat scroll,
    var(--code-bg);
}
@media (max-width: 360px) {
  .codigo-cuerpo { font-size: 0.7rem; }
  .cf-select { max-width: 54vw; }
}

.banner-aviso { background: rgba(251, 191, 36, 0.10); border: 1px solid rgba(251, 191, 36, 0.55); color: #fcd34d; }

.sim-res-volver { position: static; margin-bottom: 4px; }
.sim-res-hero { margin: 8px 0 6px; }


/* ---------- Mapa de servicios ---------- */

.btn-mapa-servicios {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(167, 139, 250, 0.12));
  border: 1.5px solid rgba(56, 189, 248, 0.45); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 18px;
  color: var(--text); transition: transform 0.15s ease;
}
.btn-mapa-servicios:active { transform: scale(0.98); }
.btn-mapa-iconos { display: flex; flex-shrink: 0; }
.btn-mapa-iconos .icono-tile { margin-left: -10px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); }
.btn-mapa-iconos .icono-tile:first-child { margin-left: 0; }
.btn-mapa-texto { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.btn-mapa-texto strong { font-size: 0.95rem; }
.btn-mapa-texto small { font-size: 0.7rem; color: var(--text-dim); line-height: 1.35; }
.btn-mapa-flecha { font-size: 1.4rem; color: var(--accent); }

.mapa-intro { font-size: 0.8rem; color: var(--text-dim); line-height: 1.55; margin: 0 0 12px; }
.mapa-intro strong { color: var(--text); }
.mapa-switch {
  display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: var(--text); cursor: pointer;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 18px;
}
.mapa-switch input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
.mapa-grupo { margin-bottom: 22px; }
.mapa-grupo-titulo { font-size: 0.95rem; margin: 0 0 3px; display: flex; gap: 8px; align-items: center; }
.mapa-grupo-nota { font-size: 0.74rem; color: var(--accent); margin: 0 0 10px; font-style: italic; line-height: 1.4; }
.mapa-grid { display: flex; flex-direction: column; gap: 8px; }
.mapa-tile {

//
// Estado global de la app + persistencia en localStorage (100% offline,
// sin backend). También contiene la lógica de "intento" de una sección:
// cómo se arma la primera tanda de lecciones y cómo se arma la tanda de
// reintento (100% de los fallados + 30% de refuerzo, ponderado hacia el
// subtema que más se falló).
//
// Lo que NO vive aquí (llega en la Parte 2): renderizar cada tipo de
// ejercicio, calificarlo, el modal de Continuar/Repasar, y la función que
// CIERRA un intento (calcula el % final y decide aprobado/reintento).
// Esos módulos usan las funciones de aquí (obtenerIntentoActual,
// generarReintento, registrarResultadoEjercicio, etc.).

// NOTA: no se importa nada de temario.js con `import` — build.py concatena
// todos los módulos de motor/ en un único <script type="module">, así que
// SECCIONES, rutaInformacion, rutaEjercicios, RETRY_REFUERZO_RATIO y
// TAMANO_MAX_LECCION (definidos en temario.js, que se concatena ANTES que
// este archivo) ya están disponibles como variables del mismo scope.

export const AppState = {
  seccionActivaId: null,
  leccionActivaIndex: 0,
  secciones: {}, // seccionId -> ver seccionVacia()
  conceptosCatalogo: null, // contenido de datos/conceptos.json (no se persiste, se re-consulta como las secciones)
  conceptos: {}, // conceptoId -> ver conceptoVacio() (SÍ se persiste: nivel, próxima revisión, historial)
  reflexiones: [], // respuestas de ejercicios texto-libre modo "reflexion" (SÍ se persiste)
  simulacros: simulacrosVacio(), // historial + simulacro en curso (SÍ se persiste, ver motor/simulacro.js)
  datosVersion: null, // DATA_VERSION con la que se guardó el progreso (ver sincronizarBancos)
};

function simulacrosVacio() {
  return {
    historial: [], // resúmenes de simulacros terminados (el más reciente al final)
    actual: null, // simulacro en curso, si lo hay
    vistos: {}, // exerciseId -> ISO de la última vez que salió en un simulacro
  };
}

function seccionVacia() {
  return {
    cargada: false, // true una vez se consultó el .json (o falló al consultarlo)
    info: null, // contenido de {id}-informacion.json
    ejercicios: [], // banco completo de {id}-ejercicios.json
    progreso: {
      aprendizajeVisto: false,
      logrosMarcados: {}, // logroId -> true
      errorBank: {}, // exerciseId -> { vecesFallado, ultimaRespuesta, resuelto }
      intentos: [], // historial de intentos ya cerrados (resumen)
      intentoActual: null, // intento en curso (ver crearLeccionesDesdeIds)
      ultimoResultadoDetalle: {}, // exerciseId -> true/false, del último intento cerrado (informativo)
      resultadoPorEjercicio: {}, // exerciseId -> true/false: ÚLTIMO resultado calificado de cada ejercicio (acumulado entre intentos)
      historialIntentoActual: [], // detalle fila x fila para el reporte (se reinicia con cada intento nuevo)
      estado: "no-iniciado", // no-iniciado | en-progreso | aprobado | requiere-reintento
